name: Dump R2 and timeline contents

on:
  workflow_dispatch:
    inputs:
      focus_days:
        description: 'Focus days (YYYYMMDD, comma-separated)'
        required: true
        default: '20261103,20261104,20261105,20261106,20261107,20261108'
      context_days:
        description: 'Extra days to include for context (comma-separated)'
        required: false
        default: '20261101,20261102,20261109,20261110'

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb

      - name: Dump R2 listing
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p dump
          rclone lsjson ":s3:${R2_BUCKET}" --recursive --files-only \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR > dump/r2-listing.json
          python3 -c "import json;print('R2 files:',len(json.load(open('dump/r2-listing.json'))))"

      - name: Download timelines
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for name in timeline.json timeline-rediff.json palette.json; do
            if rclone copyto ":s3:${R2_BUCKET}/${name}" "dump/${name}" \
                --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
                --s3-access-key-id="$R2_ACCESS_KEY_ID" \
                --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
                --s3-no-check-bucket --log-level ERROR 2>/dev/null; then
              echo "Downloaded $name ($(stat -c%s "dump/${name}") bytes)"
            else
              echo "WARNING: $name not found"
              [ "$name" = "timeline.json" ] || [ "$name" = "timeline-rediff.json" ] && echo '[]' > "dump/${name}"
            fi
          done

      - name: Slice and analyze
        env:
          FOCUS_DAYS: ${{ inputs.focus_days }}
          CONTEXT_DAYS: ${{ inputs.context_days }}
        run: |
          python3 -u <<'PY'
          import json, os
          from pathlib import Path
          from collections import defaultdict, Counter

          focus   = [d.strip() for d in os.environ['FOCUS_DAYS'].split(',')   if d.strip()]
          context = [d.strip() for d in os.environ['CONTEXT_DAYS'].split(',') if d.strip()]
          all_days = sorted(set(focus + context))

          r2   = json.load(open('dump/r2-listing.json'))
          prod = json.load(open('dump/timeline.json'))   if Path('dump/timeline.json').exists()   else []
          redf = json.load(open('dump/timeline-rediff.json')) if Path('dump/timeline-rediff.json').exists() else []

          r2_names = {e['Name'] for e in r2}
          r2_sizes = {e['Name']: e['Size'] for e in r2}

          out_root = Path('dump/focus')
          out_root.mkdir(parents=True, exist_ok=True)

          def day_entries(tl, day):
              lo, hi = day+'_000000', day+'_999999'
              return [e for e in tl if lo <= e['time'] <= hi]

          def r2_files_for(day):
              pngs  = sorted(n for n in r2_names if n.startswith(f'wdpsnapshot_{day}_'))
              diffs = sorted(n for n in r2_names if n.startswith(f'wdpdiff_{day}_'))
              return pngs, diffs

          def reconstruct_recipe(tl, day, tl_name):
              """Return a dict describing exactly how to reconstruct `day` from this timeline."""
              ents = day_entries(tl, day)
              if not ents:
                  return {'ok': False, 'reason': 'no timeline entries', 'files': []}
              first = ents[0]
              if first['kind'] == 'png':
                  base_time, base_src = first['time'], first['src']
              else:
                  base_time = first.get('base')
                  be = next((e for e in tl if e['time']==base_time and e['kind']=='png'), None)
                  if not be:
                      return {'ok': False, 'reason': f'base not in {tl_name}: {base_time}', 'files': []}
                  base_src = be['src']
              if base_src not in r2_names:
                  return {'ok': False, 'reason': f'base src missing on R2: {base_src}', 'files': []}

              needed = [base_src]
              cur_base = base_time
              for e in ents:
                  if e['kind'] == 'png':
                      if e['src'] not in r2_names:
                          return {'ok': False, 'reason': f'png src missing: {e["src"]}', 'files': needed}
                      needed.append(e['src'])
                      cur_base = e['time']
                  elif e['kind'] == 'diff':
                      b = e.get('base')
                      if b and b != cur_base:
                          be = next((x for x in tl if x['time']==b and x['kind']=='png'), None)
                          if not be:
                              return {'ok': False, 'reason': f'mid-day base not in {tl_name}: {b}', 'files': needed}
                          if be['src'] not in r2_names:
                              return {'ok': False, 'reason': f'mid-day base src missing: {be["src"]}', 'files': needed}
                          needed.append(be['src']); cur_base = b
                      if e.get('bytes', 0) != 0 and e['src'] not in r2_names:
                          return {'ok': False, 'reason': f'diff src missing: {e["src"]}', 'files': needed}
                      if e.get('bytes', 0) == 0 and e['src'] not in r2_names:
                          return {'ok': False, 'reason': f'reused-diff src missing: {e["src"]}', 'files': needed}
                      if e.get('bytes', 0) != 0:
                          needed.append(e['src'])
              return {'ok': True, 'reason': f'chain intact from base {base_time}', 'files': needed}

          summary = []
          def w(s=''): summary.append(s)

          # --- Global R2 summary ---
          total_bytes = sum(r2_sizes.values())
          pngs_all  = sorted(n for n in r2_names if n.startswith('wdpsnapshot_') and n.endswith('.png'))
          diffs_all = sorted(n for n in r2_names if n.startswith('wdpdiff_') and n.endswith('.json'))
          meta      = sorted(n for n in r2_names if n in ('timeline.json','timeline-rediff.json','palette.json','snapshots.json'))
          w('## R2 global')
          w('')
          w(f"- Files: **{len(r2_names)}** | Total: **{total_bytes/1024/1024:.1f} MB**")
          w(f"- Base PNGs: **{len(pngs_all)}** ({sum(r2_sizes[n] for n in pngs_all)/1024/1024:.1f} MB)")
          w(f"- Diffs: **{len(diffs_all)}** ({sum(r2_sizes[n] for n in diffs_all)/1024/1024:.1f} MB)")
          w(f"- Metadata: {', '.join(meta) or '(none)'}")
          w('')

          # --- Timelines overview ---
          w('## Timelines')
          w('')
          for name, tl in [('timeline.json (prod)', prod), ('timeline-rediff.json', redf)]:
              if not tl:
                  w(f"- **{name}:** EMPTY"); continue
              k = Counter(e['kind'] for e in tl)
              w(f"- **{name}:** {len(tl)} entries ({k.get('png',0)} png / {k.get('diff',0)} diff), "
                f"`{tl[0]['time']}` → `{tl[-1]['time']}`")
          w('')

          # --- Per focus/context day ---
          for day in all_days:
              is_focus = day in focus
              tag = 'FOCUS' if is_focus else 'context'
              day_dir = out_root / day
              day_dir.mkdir(exist_ok=True)

              pngs, diffs = r2_files_for(day)
              p_prod = day_entries(prod, day)
              p_redf = day_entries(redf, day)

              # Write the per-day JSON slices (what user pastes)
              (day_dir / 'timeline-prod.json').write_text(json.dumps(p_prod, indent=2))
              (day_dir / 'timeline-rediff.json').write_text(json.dumps(p_redf, indent=2))

              # R2 files for day
              with open(day_dir / 'r2-files.csv', 'w') as f:
                  f.write('kind,name,size_bytes\n')
                  for n in pngs:  f.write(f'png,{n},{r2_sizes[n]}\n')
                  for n in diffs: f.write(f'diff,{n},{r2_sizes[n]}\n')

              # Recipes
              rec_prod = reconstruct_recipe(prod, day, 'prod')
              rec_redf = reconstruct_recipe(redf, day, 'rediff')
              with open(day_dir / 'recipe.json', 'w') as f:
                  json.dump({'day': day,
                             'r2_pngs': pngs, 'r2_diffs': diffs,
                             'prod': rec_prod, 'rediff': rec_redf}, f, indent=2)

              # Summary section per day
              w(f"### `{day}`  ({tag})")
              w('')
              w(f"- R2: {len(pngs)} PNGs, {len(diffs)} diffs")
              w(f"- prod: {len(p_prod)} entries | rediff: {len(p_redf)} entries")
              w(f"- Reconstruct from prod:   {'✓' if rec_prod['ok'] else '✗'} — {rec_prod['reason']}")
              w(f"- Reconstruct from rediff: {'✓' if rec_redf['ok'] else '✗'} — {rec_redf['reason']}")
              w('')

          Path('dump/summary.md').write_text('\n'.join(summary))
          print(f"summary.md written: {len(summary)} lines")
          PY

      - name: Analyze sentinel (per focus day)
        env:
          FOCUS_DAYS: ${{ inputs.focus_days }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          IFS=',' read -ra DAYS <<< "$FOCUS_DAYS"
          mkdir -p dump/sentinel

          # Download one PNG per focus day (for alpha analysis)
          for day in "${DAYS[@]}"; do
            day=$(echo "$day" | tr -d ' ')
            [ -z "$day" ] && continue
            # Look for a base PNG for this day
            candidate=$(rclone lsf ":s3:${R2_BUCKET}" \
              --include "wdpsnapshot_${day}_*.png" \
              --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
              --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --s3-no-check-bucket --log-level ERROR | sort | head -1 || true)
            if [ -z "$candidate" ]; then
              echo "  $day: no base PNG" > "dump/sentinel/${day}.txt"
              continue
            fi
            rclone copyto ":s3:${R2_BUCKET}/${candidate}" "dump/sentinel/${candidate}" \
              --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
              --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --s3-no-check-bucket --log-level ERROR
            echo "  $day: downloaded $candidate"
          done

      - name: Sentinel check
        run: |
          python3 -u <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          from PIL import Image

          palette = json.load(open('dump/palette.json'))
          canon = {int(h[1:], 16): h for h in palette}
          sentinel_hex = '#47704c'
          sentinel_packed = int(sentinel_hex[1:], 16)

          lines = []
          lines.append("## Sentinel check per focus day")
          lines.append("")
          lines.append("For each downloaded base PNG: is `#47704c` used at α=255?")
          lines.append("")
          lines.append("| Day | File | α=0 px | α=255 px | #47704c@α=0 | #47704c@α=255 | Other colors |")
          lines.append("|---|---|---:|---:|---:|---:|---:|")

          for png in sorted(Path('dump/sentinel').glob('wdpsnapshot_*.png')):
              day = png.name[len('wdpsnapshot_'):][:8]
              arr = np.array(Image.open(png).convert('RGBA'))
              a, rgb = arr[:,:,3], arr[:,:,:3]
              packed = ((rgb[:,:,0].astype(np.uint32)<<16) | (rgb[:,:,1].astype(np.uint32)<<8) | rgb[:,:,2].astype(np.uint32))

              t_mask  = (a == 0)
              o_mask  = (a == 255)
              sent_t  = int((t_mask & (packed == sentinel_packed)).sum())
              sent_o  = int((o_mask & (packed == sentinel_packed)).sum())

              # Count distinct colors present at α=255
              unique_opaque = set(np.unique(packed[o_mask]).tolist()) if o_mask.any() else set()
              other = len(unique_opaque - {sentinel_packed})

              lines.append(f"| {day} | {png.name} | {int(t_mask.sum()):,} | {int(o_mask.sum()):,} | "
                           f"{sent_t:,} | **{sent_o:,}** | {other} |")

          Path('dump/sentinel/report.md').write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY

      - name: Final summary
        if: always()
        run: |
          {
            [ -f dump/summary.md ]          && cat dump/summary.md
            echo ""
            [ -f dump/sentinel/report.md ]  && cat dump/sentinel/report.md
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-dump-${{ github.run_id }}
          path: dump/
          retention-days: 30
          if-no-files-found: warn
