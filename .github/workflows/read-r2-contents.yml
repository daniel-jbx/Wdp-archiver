name: Dump R2 and timeline contents

on:
  workflow_dispatch:
    inputs:
      focus_days:
        description: 'Comma-separated days (YYYYMMDD)'
        required: false
        default: '20261104,20261105,20261106,20261107'

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb

      - name: Dump R2 listing
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p dump
          rclone lsjson ":s3:${R2_BUCKET}" --recursive --files-only \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR > dump/r2-listing.json
          echo "R2 files: $(python3 -c "import json;print(len(json.load(open('dump/r2-listing.json'))))")"

      - name: Download timelines
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          for name in timeline.json timeline-rediff.json; do
            if rclone copyto ":s3:${R2_BUCKET}/${name}" "dump/${name}" \
                --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
                --s3-access-key-id="$R2_ACCESS_KEY_ID" \
                --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
                --s3-no-check-bucket --log-level ERROR 2>/dev/null; then
              echo "Downloaded $name ($(stat -c%s "dump/${name}") bytes)"
            else
              echo "WARNING: $name not found — writing []"
              echo '[]' > "dump/${name}"
            fi
          done

      - name: CSV listing
        run: |
          python3 - <<'PY'
          import json
          files = json.load(open('dump/r2-listing.json'))
          files.sort(key=lambda f: f['Name'])
          with open('dump/r2-listing.csv','w') as f:
              f.write('name,size,modtime\n')
              for e in files:
                  f.write(f"{e['Name']},{e['Size']},{e.get('ModTime','')}\n")
          print(f"r2-listing.csv: {len(files)} entries")
          PY

      - name: Analyze
        env:
          FOCUS_DAYS: ${{ inputs.focus_days }}
        run: |
          python3 -u <<'PY'
          import json, os
          from pathlib import Path
          from collections import Counter

          focus_days = [d.strip() for d in os.environ['FOCUS_DAYS'].split(',') if d.strip()]
          r2     = json.load(open('dump/r2-listing.json'))
          prod   = json.load(open('dump/timeline.json'))
          rediff = json.load(open('dump/timeline-rediff.json'))

          r2_names = {e['Name'] for e in r2}
          r2_sizes = {e['Name']: e['Size'] for e in r2}
          total_bytes = sum(r2_sizes.values())

          png_files  = sorted(n for n in r2_names if n.startswith('wdpsnapshot_') and n.endswith('.png'))
          diff_files = sorted(n for n in r2_names if n.startswith('wdpdiff_') and n.endswith('.json'))
          ant_files  = sorted(n for n in r2_names if n.startswith('antarktika/'))
          meta_files = sorted(n for n in r2_names if n in ('timeline.json','timeline-rediff.json','palette.json','snapshots.json'))
          other      = sorted(r2_names - set(png_files) - set(diff_files) - set(ant_files) - set(meta_files))

          def broken(tl):
              png_times = {e['time'] for e in tl if e['kind']=='png'}
              bb, bs = [], []
              for e in tl:
                  if e['kind']=='diff' and e.get('base') and e['base'] not in png_times:
                      bb.append((e['time'], e['base']))
                  if e.get('src') and e.get('bytes',0)!=0 and e['src'] not in r2_names:
                      bs.append((e['time'], e['src'], e.get('bytes',0)))
              return bb, bs

          def day_entries(tl, day):
              lo, hi = day+'_000000', day+'_999999'
              return [e for e in tl if lo <= e['time'] <= hi]

          def r2_files_for(day):
              return (
                  sorted(n for n in r2_names if n.startswith(f'wdpsnapshot_{day}_')),
                  sorted(n for n in r2_names if n.startswith(f'wdpdiff_{day}_')),
              )

          def can_reconstruct(tl, day):
              ents = day_entries(tl, day)
              if not ents: return (False, 'no entries')
              first = ents[0]
              if first['kind']=='png':
                  if first['src'] not in r2_names:
                      return (False, f"first png src missing: {first['src']}")
                  base_time = first['time']
              else:
                  base = first.get('base')
                  be = next((e for e in tl if e['time']==base and e['kind']=='png'), None)
                  if not be: return (False, f"base not in timeline: {base}")
                  if be['src'] not in r2_names:
                      return (False, f"base png src missing: {be['src']}")
                  base_time = be['time']
              for e in ents:
                  if e['kind']!='diff': continue
                  if e.get('base') and e['base'] != base_time:
                      nb = next((x for x in tl if x['time']==e['base'] and x['kind']=='png'), None)
                      if not nb: return (False, f"mid-day base not in timeline: {e['base']}")
                      if nb['src'] not in r2_names:
                          return (False, f"mid-day base png src missing: {nb['src']}")
                      base_time = nb['time']
                  if e.get('bytes',0)!=0 and e['src'] not in r2_names:
                      return (False, f"diff src missing: {e['src']}")
              return (True, f"chain intact, starts at {base_time}")

          out = []
          def w(s=''): out.append(s)

          # ---- R2 ----
          w("## R2 storage")
          w('')
          w(f"**Total:** {len(r2_names)} files, {total_bytes/1024/1024:.1f} MB "
            f"({total_bytes/1024/1024/1024:.2f} GB)")
          w('')
          w("| Type | Count | Bytes |")
          w("|---|---:|---:|")
          w(f"| Base PNGs | {len(png_files)} | {sum(r2_sizes[n] for n in png_files)/1024/1024:.1f} MB |")
          w(f"| Diffs | {len(diff_files)} | {sum(r2_sizes[n] for n in diff_files)/1024/1024:.1f} MB |")
          w(f"| Antarktika | {len(ant_files)} | {sum(r2_sizes.get(n,0) for n in ant_files)/1024/1024:.1f} MB |")
          w(f"| Metadata | {len(meta_files)} | {sum(r2_sizes.get(n,0) for n in meta_files)/1024/1024:.1f} MB |")
          if other:
              w(f"| Other | {len(other)} | {sum(r2_sizes.get(n,0) for n in other)/1024/1024:.1f} MB |")
          w('')
          w(f"**Metadata present:** {', '.join(f'`{m}`' for m in meta_files) or '(none)'}")
          if other:
              w('')
              w(f"**Other files ({len(other)}):**")
              for n in other[:20]:
                  w(f"- `{n}` ({r2_sizes.get(n,0)} B)")
              if len(other) > 20: w(f"- … and {len(other)-20} more (see r2-listing.csv)")
          w('')

          # ---- Timelines ----
          w("## Timelines")
          w('')
          for name, tl in [('timeline.json', prod), ('timeline-rediff.json', rediff)]:
              if not tl:
                  w(f"- **{name}:** EMPTY")
                  continue
              kinds = Counter(e['kind'] for e in tl)
              dbytes = sum(e.get('bytes',0) for e in tl if e['kind']=='diff' and e.get('bytes',0)>0)
              w(f"- **{name}:** {len(tl)} entries | "
                f"{kinds.get('png',0)} png / {kinds.get('diff',0)} diff | "
                f"`{tl[0]['time']}` → `{tl[-1]['time']}` | "
                f"diff bytes: {dbytes/1024/1024:.1f} MB")
          w('')

          # ---- Broken ----
          w("## Broken references")
          w('')
          for name, tl in [('timeline.json', prod), ('timeline-rediff.json', rediff)]:
              bb, bs = broken(tl)
              w(f"**{name}:**")
              if not bb and not bs:
                  w("- ✓ Clean")
              else:
                  if bb:
                      w(f"- **{len(bb)} broken `base` refs** (base not a png entry):")
                      for t, b in bb[:10]:
                          w(f"  - `{t}` → base `{b}`")
                      if len(bb)>10: w(f"  - … and {len(bb)-10} more")
                  if bs:
                      w(f"- **{len(bs)} missing `src` files** (not on R2, bytes>0):")
                      for t, s, sz in bs[:10]:
                          w(f"  - `{t}` → src `{s}` ({sz} B)")
                      if len(bs)>10: w(f"  - … and {len(bs)-10} more")
              w('')

          # ---- Focus days ----
          w("## Focus days")
          w('')
          for day in focus_days:
              w(f"### `{day}`")
              w('')
              pngs, diffs = r2_files_for(day)
              w(f"- **R2:** {len(pngs)} PNGs, {len(diffs)} diffs")

              for name, tl in [('prod', prod), ('rediff', rediff)]:
                  ents = day_entries(tl, day)
                  if ents:
                      npng = sum(1 for e in ents if e['kind']=='png')
                      ndiff = sum(1 for e in ents if e['kind']=='diff')
                      w(f"- **`{name}` timeline:** {len(ents)} entries ({npng} png / {ndiff} diff)")
                  else:
                      w(f"- **`{name}` timeline:** *(no entries)*")

              bases = set()
              for tl in (prod, rediff):
                  for e in day_entries(tl, day):
                      if e['kind']=='diff' and e.get('base'):
                          bases.add(e['base'])
              if bases:
                  w(f"- **Bases referenced:**")
                  for b in sorted(bases):
                      png_ex = f'wdpsnapshot_{b}.png' in r2_names
                      in_p = any(x['time']==b and x['kind']=='png' for x in prod)
                      in_r = any(x['time']==b and x['kind']=='png' for x in rediff)
                      w(f"  - `{b}` — PNG: {'✓' if png_ex else '✗'} | "
                        f"prod: {'✓' if in_p else '✗'} | rediff: {'✓' if in_r else '✗'}")

              for name, tl in [('prod', prod), ('rediff', rediff)]:
                  ok, reason = can_reconstruct(tl, day)
                  w(f"- **Reconstruct from `{name}`:** {'✓' if ok else '✗'} — {reason}")
              w('')

              if pngs or diffs:
                  w("<details><summary>R2 files for this day</summary>")
                  w('')
                  for n in pngs:  w(f"- `{n}` ({r2_sizes[n]/1024:.1f} KB)")
                  for n in diffs: w(f"- `{n}` ({r2_sizes[n]/1024:.1f} KB)")
                  w('')
                  w("</details>")
                  w('')

          # ---- Transitions ----
          w("## Timeline context (kind changes across focus range)")
          w('')
          lo = focus_days[0]+'_000000'
          hi = focus_days[-1]+'_999999'
          for name, tl in [('prod', prod), ('rediff', rediff)]:
              if not tl: continue
              w(f"**{name}:**")
              around = [e for e in tl if lo <= e['time'] <= hi]
              if not around:
                  w("  (no entries)")
              else:
                  prev = None
                  for e in around:
                      if e['kind'] != prev:
                          extra = f" (base `{e['base']}`)" if e['kind']=='diff' else ''
                          w(f"- `{e['time']}` → {e['kind']} `{e.get('src','')}`{extra}")
                          prev = e['kind']
                  after = [e for e in tl if e['time'] > hi]
                  if after:
                      a = after[0]
                      extra = f" (base `{a['base']}`)" if a['kind']=='diff' else ''
                      w(f"- … `{a['time']}` → {a['kind']} `{a.get('src','')}`{extra}  ← first after range")
              w('')

          Path('dump/summary.md').write_text('\n'.join(out))
          print(f"Wrote summary.md ({len(out)} lines)")
          PY

      - name: Step summary
        if: always()
        run: |
          [ -f dump/summary.md ] && cat dump/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Per-day slices of timelines
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from collections import defaultdict
          for name in ('timeline.json','timeline-rediff.json'):
              p = Path('dump')/name
              if not p.exists() or p.stat().st_size < 100: continue
              tl = json.load(open(p))
              by_day = defaultdict(list)
              for e in tl: by_day[e['time'][:8]].append(e)
              out_dir = Path('dump/split')/name.replace('.json','')
              out_dir.mkdir(parents=True, exist_ok=True)
              for d, ents in sorted(by_day.items()):
                  (out_dir/f'{d}.json').write_text(json.dumps(ents, indent=2))
              print(f"{name}: split into {len(by_day)} day files")
          PY

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-dump-${{ github.run_id }}
          path: dump/
          retention-days: 30
          if-no-files-found: warn
