name: Recover Artifact Alpha

# Adds tRNS chunk at index 11 (#47704c) to flat P-mode snap artifacts.
# Does NOT re-quantize — artifacts are assumed to already have canonical
# palette (verified via pixel-level check before save). Re-quantizing an
# already-palette-correct image is a no-op that costs ~30s/file instead
# of ~50ms/file.
#
# Skips artifacts that already have transparency (idempotent).

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Day (YYYYMMDD)'
        required: true
      dry_run:
        description: 'Plan only, no uploads'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-alpha-${{ inputs.date }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      timestamps: ${{ steps.plan.outputs.timestamps }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - name: List snap artifacts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAY: ${{ inputs.date }}
        run: |
          set -euo pipefail
          TSS=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"snap-${DAY}_\")) | select(.expired==false) | .name | sub(\"^snap-\"; \"\")" \
            | sort -u)
          N=$(printf '%s\n' "$TSS" | grep -c . || true)
          echo "Found $N artifacts for $DAY"
          if [ "$N" -eq 0 ]; then
            echo "empty=true" >> $GITHUB_OUTPUT
            echo 'timestamps=[]' >> $GITHUB_OUTPUT
          else
            echo "empty=false" >> $GITHUB_OUTPUT
            JSON=$(printf '%s\n' "$TSS" | python3 -c \
              'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
            echo "timestamps=$JSON" >> $GITHUB_OUTPUT
          fi

  fix:
    needs: plan
    if: needs.plan.outputs.empty == 'false' && inputs.dry_run == false
    strategy:
      matrix:
        timestamp: ${{ fromJson(needs.plan.outputs.timestamps) }}
      max-parallel: 20
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow numpy

      - name: Download and fix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TS: ${{ matrix.timestamp }}
        run: |
          set -euo pipefail
          ART_NAME="snap-${TS}"

          OLD_IDS=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"$ART_NAME\") | select(.expired==false) | .id" \
            | tr '\n' ' ')
          echo "OLD_IDS=${OLD_IDS}" >> $GITHUB_ENV

          ART_ID=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"$ART_NAME\") | select(.expired==false) | \"\(.created_at) \(.id)\"" \
            | sort -r | head -1 | awk '{print $2}')
          if [ -z "$ART_ID" ]; then
            echo "::error::No artifact for $ART_NAME"
            exit 1
          fi
          mkdir -p work out
          curl -sL -f -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/${ART_ID}/zip" \
            -o work/art.zip
          python3 -c "import zipfile; zipfile.ZipFile('work/art.zip').extractall('work/extracted')"

          python3 -u <<'PY'
          import sys
          from pathlib import Path
          import numpy as np
          from PIL import Image

          TR_RGB = np.array([0x47, 0x70, 0x4c], dtype=np.uint8)

          pngs = list(Path('work/extracted').rglob('*.png'))
          if not pngs:
              sys.exit("No PNG in artifact")
          src = pngs[0]
          out_path = Path('out') / src.name

          im = Image.open(src)
          mode = im.mode
          has_tRNS = 'transparency' in im.info

          if mode != 'P':
              # Not P-mode; use the slower quantize path
              print(f"{src.name}: mode={mode} — quantize path")
              arr = np.array(im.convert('RGBA'))
              if (arr[:, :, 3] < 255).any():
                  print(f"ALREADY OK: {src.name} (RGBA with alpha)")
                  im.save(out_path)
                  sys.exit(0)
              # RGBA flat — needs full quantize
              sys.exit(f"::error::{src.name} is flat RGBA, not P-mode — "
                       f"needs full re-quantize, not simple tRNS fix")

          # P-mode. Check if already has tRNS
          if has_tRNS:
              transparency_val = im.info['transparency']
              print(f"ALREADY OK: {src.name} (P-mode with tRNS at index {transparency_val})")
              im.save(out_path)
              sys.exit(0)

          # P-mode flat — find #47704c in palette
          pal = im.getpalette()
          tr_idx = None
          for i in range(0, len(pal), 3):
              if pal[i:i+3] == [0x47, 0x70, 0x4c]:
                  tr_idx = i // 3
                  break

          if tr_idx is None:
              sys.exit(f"::error::#47704c not found in palette")

          # Verify: every pixel whose RGB is #47704c must be at index tr_idx.
          # This guards against corrupt palettes (e.g. pngquant-derived) where
          # #47704c might appear at some other index, or where similar colors
          # got merged.
          idx_arr = np.array(im)  # P-mode indices, shape (H, W)
          rgba_arr = np.array(im.convert('RGBA'))
          tr_by_rgb = np.all(rgba_arr[:, :, :3] == TR_RGB, axis=2)
          tr_by_idx = (idx_arr == tr_idx)

          n_rgb = int(tr_by_rgb.sum())
          n_idx = int(tr_by_idx.sum())

          if not np.array_equal(tr_by_rgb, tr_by_idx):
              n_mismatch = int((tr_by_rgb != tr_by_idx).sum())
              sys.exit(f"::error::palette inconsistency: {n_mismatch} pixels differ "
                       f"between RGB-match ({n_rgb}) and idx-match ({n_idx})")

          if n_rgb == 0:
              sys.exit(f"::error::no #47704c pixels — can't add tRNS meaningfully")

          # Direct save with tRNS
          im.save(out_path, format='PNG', optimize=True, transparency=tr_idx)
          size = out_path.stat().st_size
          print(f"FIXED: {src.name} → {size:,}B, "
                f"tRNS at index {tr_idx}, {n_rgb:,} transparent px")
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.timestamp }}
          path: out/
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Delete old duplicates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for id in ${OLD_IDS:-}; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true
          done
