name: Recover Artifact Alpha

# Converts flat P-mode snap artifacts (no tRNS chunk) into P-mode with
# transparency at index 11 (#47704c). Needed when reconstruction pipelines
# flattened artifacts by dropping the tRNS chunk. Does NOT remap colors —
# only restores the transparency invariant.
#
# Verify pass confirms #47704c pixels have alpha=0 after save.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Day (YYYYMMDD)'
        required: true
      dry_run:
        description: 'Analyze only, no uploads'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: recover-alpha-${{ inputs.date }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      timestamps: ${{ steps.plan.outputs.timestamps }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - name: List snap artifacts
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAY: ${{ inputs.date }}
        run: |
          set -euo pipefail
          TSS=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"snap-${DAY}_\")) | select(.expired==false) | .name | sub(\"^snap-\"; \"\")" \
            | sort -u)
          N=$(printf '%s\n' "$TSS" | grep -c . || true)
          echo "Found $N artifacts for $DAY"
          if [ "$N" -eq 0 ]; then
            echo "empty=true" >> $GITHUB_OUTPUT
            echo 'timestamps=[]' >> $GITHUB_OUTPUT
          else
            echo "empty=false" >> $GITHUB_OUTPUT
            JSON=$(printf '%s\n' "$TSS" | python3 -c \
              'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
            echo "timestamps=$JSON" >> $GITHUB_OUTPUT
          fi

  fix:
    needs: plan
    if: needs.plan.outputs.empty == 'false' && inputs.dry_run == false
    strategy:
      matrix:
        timestamp: ${{ fromJson(needs.plan.outputs.timestamps) }}
      max-parallel: 20
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow numpy

      - name: Download and fix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TS: ${{ matrix.timestamp }}
        run: |
          set -euo pipefail
          ART_NAME="snap-${TS}"

          OLD_IDS=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"$ART_NAME\") | select(.expired==false) | .id" \
            | tr '\n' ' ')
          echo "OLD_IDS=${OLD_IDS}" >> $GITHUB_ENV

          ART_ID=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"$ART_NAME\") | select(.expired==false) | \"\(.created_at) \(.id)\"" \
            | sort -r | head -1 | awk '{print $2}')
          if [ -z "$ART_ID" ]; then
            echo "::error::No artifact for $ART_NAME"
            exit 1
          fi
          mkdir -p work out
          curl -sL -f -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/${ART_ID}/zip" \
            -o work/art.zip
          python3 -c "import zipfile; zipfile.ZipFile('work/art.zip').extractall('work/extracted')"

          python3 -u <<'PY'
          import sys
          from pathlib import Path
          import numpy as np
          from PIL import Image

          TR_RGB = np.array([0x47, 0x70, 0x4c], dtype=np.uint8)

          pngs = list(Path('work/extracted').rglob('*.png'))
          if not pngs:
              sys.exit("No PNG in artifact")
          src = pngs[0]

          im = Image.open(src)
          mode = im.mode
          has_tRNS = 'transparency' in im.info
          arr = np.array(im.convert('RGBA'))
          alpha = arr[:, :, 3]

          # Detect palette index for #47704c
          tr_idx = None
          if mode == 'P':
              pal = im.getpalette()
              if pal:
                  for i in range(0, len(pal), 3):
                      if pal[i:i+3] == [0x47, 0x70, 0x4c]:
                          tr_idx = i // 3
                          break

          # Check if truly flat (no alpha) or already has tRNS
          if has_tRNS or (alpha < 255).any():
              print(f"ALREADY OK: {src.name} mode={mode} has_tRNS={has_tRNS} "
                    f"transparent_px={(alpha==0).sum():,}")
              import shutil
              shutil.copy2(src, Path('out') / src.name)
              sys.exit(0)

          if mode != 'P' or tr_idx is None:
              sys.exit(f"Flat but not fixable via tRNS: mode={mode}, tr_idx={tr_idx}")

          # Verify #47704c is the only sentinel-color present
          tr_mask = np.all(arr[:, :, :3] == TR_RGB, axis=2)
          n_tr = int(tr_mask.sum())
          if n_tr == 0:
              sys.exit(f"No #47704c pixels found — can't add tRNS")

          # Convert to P-mode with tRNS at tr_idx
          pal_bytes = [int(pal[i]) for i in range(len(pal))]
          new = Image.fromarray(arr[:, :, :3], 'RGB').quantize(
              palette=im, dither=Image.Dither.NONE if hasattr(Image, 'Dither') else 0
          )
          # Force palette match to the source's palette
          new.putpalette(pal_bytes)
          new.info['transparency'] = tr_idx

          out_path = Path('out') / src.name
          new.save(out_path, format='PNG', optimize=True, transparency=tr_idx)
          print(f"FIXED: {src.name} → {out_path.stat().st_size:,}B, "
                f"transparent_px={n_tr:,}")
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.timestamp }}
          path: out/
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Delete old duplicates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          for id in ${OLD_IDS:-}; do
            [ -z "$id" ] && continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true
          done
