name: R2 Monthly Sparsen (>30 days → 1/3hr)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List and download cull set but do not delete from R2'
        type: boolean
        default: true
      age_days:
        description: 'Only sparsen snapshots older than this many days'
        type: string
        default: '30'
      bucket_hours:
        description: 'Retention bucket size in hours for old snapshots'
        type: string
        default: '3'

permissions:
  contents: read

jobs:
  sparsen:
    runs-on: ubuntu-latest
    steps:
      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb
          rm rclone-current-linux-amd64.deb

      - name: Build cull list
        id: cull
        run: |
          set -euo pipefail
          export BUCKET="${{ secrets.R2_BUCKET }}"
          export NOW=$(date +%s)
          export AGE_DAYS="${{ inputs.age_days }}"
          export BUCKET_HOURS="${{ inputs.bucket_hours }}"
          export BUCKET_SECONDS=$(( BUCKET_HOURS * 3600 ))

          rclone lsf ":s3:${BUCKET}" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="${{ secrets.R2_ENDPOINT }}" \
            --s3-access-key-id="${{ secrets.R2_ACCESS_KEY_ID }}" \
            --s3-secret-access-key="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            --s3-no-check-bucket \
            --include "wdpsnapshot_*.png" > all_snapshots.txt

          echo "Files returned by rclone lsf: $(wc -l < all_snapshots.txt)"

          python3 << 'PY'
          import os, re, sys
          from datetime import datetime, timezone

          NOW            = int(os.environ["NOW"])
          AGE_DAYS       = int(os.environ["AGE_DAYS"])
          BUCKET_SECONDS = int(os.environ["BUCKET_SECONDS"])
          cutoff         = NOW - AGE_DAYS * 86400

          pattern = re.compile(r"wdpsnapshot_(\d{8})_(\d{6})\.png$")
          by_bucket = {}
          unmatched = 0
          skipped_fresh = 0

          with open("all_snapshots.txt") as f:
              for line in f:
                  name = line.strip()
                  if not name:
                      continue
                  m = pattern.search(name)
                  if not m:
                      unmatched += 1
                      continue
                  dt = datetime.strptime(
                      m.group(1) + m.group(2), "%Y%m%d%H%M%S"
                  ).replace(tzinfo=timezone.utc)
                  epoch = int(dt.timestamp())
                  if epoch >= cutoff:
                      skipped_fresh += 1
                      continue
                  bucket = epoch - (epoch % BUCKET_SECONDS)
                  by_bucket.setdefault(bucket, []).append((epoch, name))

          if unmatched > 0 and not by_bucket:
              print(f"ERROR: {unmatched} files did not match the expected pattern")
              print("First 10 files from rclone lsf:")
              with open("all_snapshots.txt") as f:
                  for i, line in enumerate(f):
                      if i >= 10:
                          break
                      print("  " + line.rstrip())
              sys.exit(1)

          cull = []
          for bucket in sorted(by_bucket):
              entries = sorted(by_bucket[bucket])
              # keep earliest in each bucket; cull the rest
              for _, name in entries[1:]:
                  cull.append(name)

          with open("cull_list.txt", "w") as out:
              for name in cull:
                  out.write(name + "\n")

          total_old = sum(len(v) for v in by_bucket.values())
          print(f"Snapshots older than {AGE_DAYS}d (matched): {total_old}")
          print(f"Snapshots newer than {AGE_DAYS}d (skipped): {skipped_fresh}")
          print(f"Unmatched filenames (skipped): {unmatched}")
          print(f"Buckets: {len(by_bucket)}")
          print(f"Retained (earliest per {BUCKET_SECONDS//3600}h bucket): {len(by_bucket)}")
          print(f"Cull set size: {len(cull)}")
          PY

          echo "cull_count=$(wc -l < cull_list.txt)" >> "$GITHUB_OUTPUT"

      - name: Download culled snapshots
        if: ${{ steps.cull.outputs.cull_count != '0' }}
        run: |
          mkdir -p culled
          rclone copy \
            --files-from cull_list.txt \
            ":s3:${{ secrets.R2_BUCKET }}" culled/ \
            --s3-provider="Cloudflare" \
            --s3-endpoint="${{ secrets.R2_ENDPOINT }}" \
            --s3-access-key-id="${{ secrets.R2_ACCESS_KEY_ID }}" \
            --s3-secret-access-key="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            --s3-no-check-bucket \
            --verbose

      - name: Verify downloaded count matches cull list
        if: ${{ steps.cull.outputs.cull_count != '0' }}
        run: |
          expected="${{ steps.cull.outputs.cull_count }}"
          actual=$(find culled -type f -name '*.png' | wc -l)
          echo "Expected: $expected, downloaded: $actual"
          if [ "$actual" -ne "$expected" ]; then
            echo "ERROR: downloaded file count does not match cull list"
            exit 1
          fi

      - name: Upload culled snapshots as artifact
        if: ${{ steps.cull.outputs.cull_count != '0' }}
        uses: actions/upload-artifact@v4
        with:
          name: culled-snapshots-${{ github.run_id }}
          path: culled/
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn

      - name: Delete culled snapshots from R2
        if: ${{ !inputs.dry_run && steps.cull.outputs.cull_count != '0' }}
        run: |
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            rclone delete ":s3:${{ secrets.R2_BUCKET }}/${file}" \
              --s3-provider="Cloudflare" \
              --s3-endpoint="${{ secrets.R2_ENDPOINT }}" \
              --s3-access-key-id="${{ secrets.R2_ACCESS_KEY_ID }}" \
              --s3-secret-access-key="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
              --s3-no-check-bucket
          done < cull_list.txt

      - name: Regenerate snapshots.json
        if: ${{ !inputs.dry_run && steps.cull.outputs.cull_count != '0' }}
        run: |
          rclone lsf ":s3:${{ secrets.R2_BUCKET }}" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="${{ secrets.R2_ENDPOINT }}" \
            --s3-access-key-id="${{ secrets.R2_ACCESS_KEY_ID }}" \
            --s3-secret-access-key="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            --s3-no-check-bucket \
            --include "wdpsnapshot_*.png" | sort | jq -R . | jq -s . > snapshots.json
          rclone copyto snapshots.json ":s3:${{ secrets.R2_BUCKET }}/snapshots.json" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="${{ secrets.R2_ENDPOINT }}" \
            --s3-access-key-id="${{ secrets.R2_ACCESS_KEY_ID }}" \
            --s3-secret-access-key="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            --s3-no-check-bucket

      - name: Summary
        if: always()
        run: |
          echo "### R2 Monthly Sparsen" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setting | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | \`${{ inputs.dry_run }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Age threshold | \`${{ inputs.age_days }}\` days |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bucket size | \`${{ inputs.bucket_hours }}\` hours |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cull set size | \`${{ steps.cull.outputs.cull_count }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "**Dry run — nothing was deleted from R2.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Deleted culled snapshots from R2 and regenerated snapshots.json.**" >> "$GITHUB_STEP_SUMMARY"
          fi
