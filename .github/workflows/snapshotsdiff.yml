name: Diff Snapshots

on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - timestamps.json

# Grant write permissions for the GITHUB_TOKEN
permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can push

      - name: Install ImageMagick, rclone, and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb
          rm rclone-current-linux-amd64.deb

      - name: Read timestamps from JSON
        id: read_json
        run: |
          START=$(jq -r '.start' timestamps.json)
          END=$(jq -r '.end' timestamps.json)
          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT

      - name: Get snapshots list from R2
        run: |
          rclone cat ":s3:${R2_BUCKET}/snapshots.json" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            > snapshots.json
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Find closest snapshots
        id: find
        run: |
          python3 << EOF
          import json
          import os
          import sys
          import re
          from datetime import datetime

          with open('snapshots.json') as f:
              try:
                  raw = json.load(f)
              except:
                  raw = []
          if not isinstance(raw, list):
              raw = []

          pattern = re.compile(r'^wdpsnapshot_\d{8}_\d{6}\.png$')
          snapshots = [s for s in raw if isinstance(s, str) and pattern.match(s)]

          print(f"Valid snapshots found: {len(snapshots)}", file=sys.stderr)
          if not snapshots:
              print("No valid snapshots found in snapshots.json!", file=sys.stderr)
              sys.exit(1)

          start_str = os.environ['START']
          end_str   = os.environ['END']

          def parse_ts(filename):
              base = filename.replace('wdpsnapshot_', '').replace('.png', '')
              return datetime.strptime(base, '%Y%m%d_%H%M%S')

          start_dt = datetime.strptime(start_str, '%Y%m%d_%H%M%S')
          end_dt   = datetime.strptime(end_str,   '%Y%m%d_%H%M%S')

          def closest_to(target, snapshots):
              return min(snapshots, key=lambda f: abs((parse_ts(f) - target).total_seconds()))

          snap1 = closest_to(start_dt, snapshots)
          snap2 = closest_to(end_dt, snapshots)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"snapshot1={snap1}\n")
              out.write(f"snapshot2={snap2}\n")
          EOF
        env:
          START: ${{ steps.read_json.outputs.start }}
          END: ${{ steps.read_json.outputs.end }}

      - name: Download snapshots from R2
        run: |
          rclone copyto ":s3:${R2_BUCKET}/${{ steps.find.outputs.snapshot1 }}" snapshot1.png \
            --s3-provider="Cloudflare" \
            --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --verbose
          rclone copyto ":s3:${R2_BUCKET}/${{ steps.find.outputs.snapshot2 }}" snapshot2.png \
            --s3-provider="Cloudflare" \
            --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --verbose
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Generate diff image (robust)
        id: diff
        run: |
          # Show image info for debugging
          identify snapshot1.png snapshot2.png

          # Run compare, but do NOT let exit code stop the script
          set +e
          compare -metric AE -highlight-color red snapshot1.png snapshot2.png diff.png 2> metric.txt
          COMPARE_EXIT=$?
          set -e

          METRIC=$(cat metric.txt | tr -d '\n ' | cut -d'(' -f1)
          echo "Metric (number of differing pixels): $METRIC"
          echo "metric=$METRIC" >> $GITHUB_OUTPUT

          # Fallback if diff.png wasn't produced
          if [ ! -f diff.png ]; then
            echo "compare did not produce diff.png - creating overlay"
            composite -compose difference snapshot1.png snapshot2.png diff_raw.png
            convert diff_raw.png -auto-level -channel RGB -evaluate set 100% -fill red -opaque white diff.png
          fi

          exit 0

      - name: Commit and push diff.png to repo
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add the diff file (overwrites existing)
          git add diff.png

          # Commit if there are changes; if nothing changed, skip commit
          git commit -m "Update diff.png [skip ci]" || echo "No changes to commit"

          # Push the commit to the current branch
          git push
        env:
          # The GITHUB_TOKEN is automatically used by git push
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
