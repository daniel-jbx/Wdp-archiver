name: Diff Snapshots

on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - timestamps.json

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ImageMagick, rclone, and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb
          rm rclone-current-linux-amd64.deb

      - name: Read timestamps from JSON
        id: read_json
        run: |
          START=$(jq -r '.start' timestamps.json)
          END=$(jq -r '.end' timestamps.json)
          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT

      - name: Get snapshots list from R2
        run: |
          rclone cat ":s3:${R2_BUCKET}/snapshots.json" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            > snapshots.json
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Find closest snapshots
        id: find
        run: |
          python3 << EOF
          import json, os, sys, re
          from datetime import datetime

          with open('snapshots.json') as f:
              try:
                  raw = json.load(f)
              except:
                  raw = []
          if not isinstance(raw, list):
              raw = []

          pattern = re.compile(r'^wdpsnapshot_\d{8}_\d{6}\.png$')
          snapshots = [s for s in raw if isinstance(s, str) and pattern.match(s)]

          print(f"Valid snapshots found: {len(snapshots)}", file=sys.stderr)
          if not snapshots:
              print("No valid snapshots found!", file=sys.stderr)
              sys.exit(1)

          start_str, end_str = os.environ['START'], os.environ['END']
          def parse_ts(f):
              base = f.replace('wdpsnapshot_', '').replace('.png', '')
              return datetime.strptime(base, '%Y%m%d_%H%M%S')

          start_dt, end_dt = datetime.strptime(start_str, '%Y%m%d_%H%M%S'), datetime.strptime(end_str, '%Y%m%d_%H%M%S')
          snap1 = min(snapshots, key=lambda f: abs((parse_ts(f)-start_dt).total_seconds()))
          snap2 = min(snapshots, key=lambda f: abs((parse_ts(f)-end_dt).total_seconds()))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"snapshot1={snap1}\nsnapshot2={snap2}\n")
          EOF
        env:
          START: ${{ steps.read_json.outputs.start }}
          END: ${{ steps.read_json.outputs.end }}

      - name: Download snapshots from R2
        run: |
          rclone copyto ":s3:${R2_BUCKET}/${{ steps.find.outputs.snapshot1 }}" snapshot1.png \
            --s3-provider="Cloudflare" --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" --verbose
          rclone copyto ":s3:${R2_BUCKET}/${{ steps.find.outputs.snapshot2 }}" snapshot2.png \
            --s3-provider="Cloudflare" --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" --verbose
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Generate diff (transparent background, faint unchanged, full changed)
        id: diff
        run: |
          set +e
          # Get dimensions
          W=$(identify -format "%w" snapshot1.png)
          H=$(identify -format "%h" snapshot2.png)

          # Create a mask: white where pixels differ (with fuzz 5%), black elsewhere
          compare -metric AE -fuzz 5% -compose difference snapshot1.png snapshot2.png mask.png 2> metric.txt
          METRIC=$(cat metric.txt | tr -d '\n ' | cut -d'(' -f1)
          echo "Differing pixels: $METRIC"
          echo "metric=$METRIC" >> $GITHUB_OUTPUT

          # Build the diff image:
          # 1. background = snapshot2 at 10% opacity
          # 2. overlay = snapshot2 with alpha = mask (so diff pixels are opaque, same are transparent)
          # Then composite overlay on top of background.
          convert snapshot2.png \
            \( -clone 0 -alpha set -channel A -evaluate set 10% \) \
            \( -clone 0 \( mask.png -alpha off -threshold 1% \) -alpha off -compose CopyOpacity -composite \) \
            -delete 0 \
            -composite diff.png

          # If metric is 0, diff will be just the faint background – we can add a label.
          if [ "$METRIC" = "0" ] || [ "$METRIC" = "0.000000" ]; then
            convert diff.png -fill "rgba(255,0,0,0.8)" -pointsize 48 -gravity center -annotate +0+0 "No changes" diff.png
          fi

          exit 0

      - name: Commit and push diff.png to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diff.png
          git commit -m "Update diff.png [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
