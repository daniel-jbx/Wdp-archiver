name: Diff Snapshots

on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - timestamps.json

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rclone, jq, and Python Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb
          rm rclone-current-linux-amd64.deb
          pip install Pillow

      - name: Read timestamps from JSON
        id: read_json
        run: |
          START=$(jq -r '.start' timestamps.json)
          END=$(jq -r '.end' timestamps.json)
          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT

      - name: Get snapshots list from R2
        run: |
          rclone cat ":s3:${R2_BUCKET}/snapshots.json" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            > snapshots.json
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Find closest snapshots
        id: find
        run: |
          python3 << EOF
          import json, os, sys, re
          from datetime import datetime

          with open('snapshots.json') as f:
              try:
                  raw = json.load(f)
              except:
                  raw = []
          if not isinstance(raw, list):
              raw = []

          pattern = re.compile(r'^wdpsnapshot_\d{8}_\d{6}\.png$')
          snapshots = [s for s in raw if isinstance(s, str) and pattern.match(s)]

          print(f"Valid snapshots found: {len(snapshots)}", file=sys.stderr)
          if not snapshots:
              print("No valid snapshots found!", file=sys.stderr)
              sys.exit(1)

          start_str, end_str = os.environ['START'], os.environ['END']
          def parse_ts(f):
              base = f.replace('wdpsnapshot_', '').replace('.png', '')
              return datetime.strptime(base, '%Y%m%d_%H%M%S')

          start_dt = datetime.strptime(start_str, '%Y%m%d_%H%M%S')
          end_dt = datetime.strptime(end_str, '%Y%m%d_%H%M%S')
          snap1 = min(snapshots, key=lambda f: abs((parse_ts(f)-start_dt).total_seconds()))
          snap2 = min(snapshots, key=lambda f: abs((parse_ts(f)-end_dt).total_seconds()))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"snapshot1={snap1}\nsnapshot2={snap2}\n")
          EOF
        env:
          START: ${{ steps.read_json.outputs.start }}
          END: ${{ steps.read_json.outputs.end }}

      - name: Download snapshots from R2
        run: |
          rclone copyto ":s3:${R2_BUCKET}/${{ steps.find.outputs.snapshot1 }}" snapshot1.png \
            --s3-provider="Cloudflare" --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" --verbose
          rclone copyto ":s3:${R2_BUCKET}/${{ steps.find.outputs.snapshot2 }}" snapshot2.png \
            --s3-provider="Cloudflare" --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" --verbose
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Generate diff with Python (Pillow)
        id: diff
        run: |
          python3 << 'EOF'
          from PIL import Image, ImageDraw
          import sys

          # Load snapshots
          snap1 = Image.open('snapshot1.png').convert('RGB')
          snap2 = Image.open('snapshot2.png').convert('RGB')
          w, h = snap1.size
          print(f"Image size: {w}x{h}")

          # --- Adjust opacity for unchanged pixels here ---
          UNCHANGED_OPACITY = 10    # in percent (change to 5 for 5%)
          # ------------------------------------------------

          # Threshold for "difference" (5% fuzz = 13/255)
          THRESHOLD = 13

          # Create an alpha mask: white where different, black where same
          mask = Image.new('L', (w, h), 0)
          pixels1 = snap1.load()
          pixels2 = snap2.load()
          mask_px = mask.load()

          diff_count = 0
          for y in range(h):
              for x in range(w):
                  r1, g1, b1 = pixels1[x, y]
                  r2, g2, b2 = pixels2[x, y]
                  max_diff = max(abs(r1-r2), abs(g1-g2), abs(b1-b2))
                  if max_diff > THRESHOLD:
                      mask_px[x, y] = 255  # fully opaque (changed)
                      diff_count += 1
                  else:
                      mask_px[x, y] = 0    # will become UNCHANGED_OPACITY later

          print(f"Differing pixels: {diff_count}")

          # Create the final RGBA image from snapshot2
          result = snap2.convert('RGBA')

          if diff_count == 0:
              # No changes: show snapshot2 at UNCHANGED_OPACITY with a label
              alpha = Image.new('L', (w, h), int(255 * UNCHANGED_OPACITY / 100))
              result.putalpha(alpha)
              draw = ImageDraw.Draw(result)
              # Red text, semi‑transparent background already set
              draw.text((w//2, h//2), "No changes", fill=(255,0,0,255), anchor="mm")
          else:
              # Build alpha from mask: black → UNCHANGED_OPACITY, white → 100%
              alpha = Image.new('L', (w, h))
              alpha_px = alpha.load()
              unchanged_val = int(255 * UNCHANGED_OPACITY / 100)
              for y in range(h):
                  for x in range(w):
                      if mask_px[x, y] == 255:
                          alpha_px[x, y] = 255        # 100% opaque
                      else:
                          alpha_px[x, y] = unchanged_val  # UNCHANGED_OPACITY opaque
              result.putalpha(alpha)

          result.save('diff.png')
          print("Diff generation complete")
          EOF
          exit 0

      - name: Commit and push diff.png to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diff.png
          git commit -m "Update diff.png [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
