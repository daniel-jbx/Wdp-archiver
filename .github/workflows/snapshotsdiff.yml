name: Diff Snapshots

on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - timestamps.json

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ImageMagick, rclone, and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb
          rm rclone-current-linux-amd64.deb

      - name: Read timestamps from JSON
        id: read_json
        run: |
          START=$(jq -r '.start' timestamps.json)
          END=$(jq -r '.end' timestamps.json)
          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT

      - name: Get snapshots list from R2
        run: |
          rclone cat ":s3:${R2_BUCKET}/snapshots.json" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            > snapshots.json
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Find closest snapshots
        id: find
        run: |
          python3 << EOF
          import json, os, sys, re
          from datetime import datetime

          with open('snapshots.json') as f:
              try:
                  raw = json.load(f)
              except:
                  raw = []
          if not isinstance(raw, list):
              raw = []

          pattern = re.compile(r'^wdpsnapshot_\d{8}_\d{6}\.png$')
          snapshots = [s for s in raw if isinstance(s, str) and pattern.match(s)]

          print(f"Valid snapshots found: {len(snapshots)}", file=sys.stderr)
          if not snapshots:
              print("No valid snapshots found!", file=sys.stderr)
              sys.exit(1)

          start_str, end_str = os.environ['START'], os.environ['END']
          def parse_ts(f):
              base = f.replace('wdpsnapshot_', '').replace('.png', '')
              return datetime.strptime(base, '%Y%m%d_%H%M%S')

          start_dt = datetime.strptime(start_str, '%Y%m%d_%H%M%S')
          end_dt = datetime.strptime(end_str, '%Y%m%d_%H%M%S')
          snap1 = min(snapshots, key=lambda f: abs((parse_ts(f)-start_dt).total_seconds()))
          snap2 = min(snapshots, key=lambda f: abs((parse_ts(f)-end_dt).total_seconds()))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"snapshot1={snap1}\nsnapshot2={snap2}\n")
          EOF
        env:
          START: ${{ steps.read_json.outputs.start }}
          END: ${{ steps.read_json.outputs.end }}

      - name: Download snapshots from R2
        run: |
          rclone copyto ":s3:${R2_BUCKET}/${{ steps.find.outputs.snapshot1 }}" snapshot1.png \
            --s3-provider="Cloudflare" --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" --verbose
          rclone copyto ":s3:${R2_BUCKET}/${{ steps.find.outputs.snapshot2 }}" snapshot2.png \
            --s3-provider="Cloudflare" --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" --verbose
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Generate diff (unchanged 10% opacity, changed 100% opacity)
        id: diff
        run: |
          set -x
          set -e

          echo "=== Image info ==="
          ls -la snapshot1.png snapshot2.png
          identify snapshot1.png snapshot2.png

          # Strip alpha → pure RGB for comparison
          convert snapshot1.png -alpha remove snapshot1_rgb.png
          convert snapshot2.png -alpha remove snapshot2_rgb.png

          # Compute per-pixel maximum difference across R,G,B channels
          convert snapshot1_rgb.png snapshot2_rgb.png \
            -compose difference -composite \
            -channel RGB -separate -evaluate-sequence Max \
            diff_max.png

          # 5% fuzz → threshold ≈ 13 (out of 255)
          convert diff_max.png -threshold 13 mask.png

          # Count differing pixels (white in mask)
          DIFF_COUNT=$(convert mask.png -format "%[fx:mean*w*h]" info:)
          echo "Differing pixels: $DIFF_COUNT"

          if [ "$DIFF_COUNT" = "0" ] || [ "$DIFF_COUNT" = "0.0" ]; then
            echo "No differences — showing snapshot2 at 10% opacity with note"
            convert snapshot2.png \
              -alpha set -channel A -evaluate set 10% +channel \
              -fill "rgba(255,0,0,0.8)" -pointsize 48 -gravity center \
              -annotate +0+0 "No changes" diff.png
          else
            echo "Differences found — building opacity-based overlay"
            # Convert mask to alpha: unchanged (black) → 10%, changed (white) → 100%
            # black → gray(26) (≈10% opacity), white → white (100% opacity)
            convert mask.png \
              -fill "gray(26)" -opaque black \
              -fill white -opaque white \
              alpha.png

            # Apply alpha to snapshot2
            convert snapshot2.png -alpha remove alpha.png \
              -compose CopyOpacity -composite diff.png
          fi

          # Clean temporary files
          rm -f snapshot1_rgb.png snapshot2_rgb.png diff_max.png mask.png alpha.png

          echo "Diff generation complete"
          exit 0

      - name: Commit and push diff.png to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diff.png
          git commit -m "Update diff.png [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
