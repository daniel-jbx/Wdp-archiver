name: Diff Snapshots

on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - timestamps.json

permissions:
  contents: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ImageMagick, rclone, and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb
          rm rclone-current-linux-amd64.deb

      - name: Read timestamps from JSON
        id: read_json
        run: |
          START=$(jq -r '.start' timestamps.json)
          END=$(jq -r '.end' timestamps.json)
          echo "start=$START" >> $GITHUB_OUTPUT
          echo "end=$END" >> $GITHUB_OUTPUT

      - name: Get snapshots list from R2
        run: |
          rclone cat ":s3:${R2_BUCKET}/snapshots.json" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            > snapshots.json
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Find closest snapshots
        id: find
        run: |
          python3 << EOF
          import json, os, sys, re
          from datetime import datetime

          with open('snapshots.json') as f:
              try:
                  raw = json.load(f)
              except:
                  raw = []
          if not isinstance(raw, list):
              raw = []

          pattern = re.compile(r'^wdpsnapshot_\d{8}_\d{6}\.png$')
          snapshots = [s for s in raw if isinstance(s, str) and pattern.match(s)]

          print(f"Valid snapshots found: {len(snapshots)}", file=sys.stderr)
          if not snapshots:
              print("No valid snapshots found!", file=sys.stderr)
              sys.exit(1)

          start_str, end_str = os.environ['START'], os.environ['END']
          def parse_ts(f):
              base = f.replace('wdpsnapshot_', '').replace('.png', '')
              return datetime.strptime(base, '%Y%m%d_%H%M%S')

          start_dt = datetime.strptime(start_str, '%Y%m%d_%H%M%S')
          end_dt = datetime.strptime(end_str, '%Y%m%d_%H%M%S')
          snap1 = min(snapshots, key=lambda f: abs((parse_ts(f)-start_dt).total_seconds()))
          snap2 = min(snapshots, key=lambda f: abs((parse_ts(f)-end_dt).total_seconds()))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"snapshot1={snap1}\nsnapshot2={snap2}\n")
          EOF
        env:
          START: ${{ steps.read_json.outputs.start }}
          END: ${{ steps.read_json.outputs.end }}

      - name: Download snapshots from R2
        run: |
          rclone copyto ":s3:${R2_BUCKET}/${{ steps.find.outputs.snapshot1 }}" snapshot1.png \
            --s3-provider="Cloudflare" --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" --verbose
          rclone copyto ":s3:${R2_BUCKET}/${{ steps.find.outputs.snapshot2 }}" snapshot2.png \
            --s3-provider="Cloudflare" --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" --verbose
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Generate transparent diff (changed pixels full opacity, same transparent)
        id: diff
        run: |
          # 1. Strip alpha from both images to compare RGB only
          convert snapshot1.png -alpha off snapshot1_rgb.png
          convert snapshot2.png -alpha off snapshot2_rgb.png

          # 2. Create a difference mask: white where RGB differs (with 5% fuzz to ignore compression artifacts)
          #    The mask will be grayscale: white = different, black = same.
          compare -fuzz 5% -compose difference snapshot1_rgb.png snapshot2_rgb.png mask.png

          # 3. Binarize the mask: any non‑black becomes pure white (ensures clean alpha)
          convert mask.png -threshold 0 mask_binary.png

          # 4. Count differing pixels (just for logging)
          DIFF_COUNT=$(convert mask_binary.png -format "%[fx:mean*w*h]" info:)
          echo "Differing pixels: $DIFF_COUNT"

          # 5. If no differences, create a fully transparent image with a small red note
          if [ "$DIFF_COUNT" = "0" ] || [ "$DIFF_COUNT" = "0.0" ]; then
            convert -size $(identify -format "%wx%h" snapshot2.png) xc:none \
              -fill "rgba(255,0,0,0.6)" -pointsize 48 -gravity center -annotate +0+0 "No changes" \
              diff.png
          else
            # 6. Use the binary mask as the alpha channel of snapshot2's RGB channels
            #    This makes changed pixels fully opaque, unchanged fully transparent.
            convert snapshot2.png -alpha off \
              mask_binary.png -compose CopyOpacity -composite diff.png
          fi

          # Clean up
          rm -f snapshot1_rgb.png snapshot2_rgb.png mask.png mask_binary.png

          exit 0

      - name: Commit and push diff.png to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diff.png
          git commit -m "Update diff.png [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
