name: Reconstruct snap artifacts for a day

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to reconstruct (YYYYMMDD)'
        required: true
      stop_before:
        description: 'Optional YYYYMMDD_HHMMSS. Only reconstruct entries < this time.'
        required: false
        default: ''
      force:
        description: 'Force rebuild ALL artifacts in scope (needed if existing ones are flattened)'
        type: boolean
        default: true
      skip_timestamps:
        description: 'Comma-separated timestamps to preserve (skip reconstruct)'
        required: false
        default: ''
      dry_run:
        description: 'List what would be done, no reconstruction'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

jobs:
  determine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      missing: ${{ steps.determine.outputs.missing }}
      empty: ${{ steps.determine.outputs.empty }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rclone
        run: |
          curl -fsSL -o rclone.deb https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone.deb
          rm -f rclone.deb

      - name: Download timeline (rediff preferred) and palette
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p work
          if rclone lsf ":s3:${R2_BUCKET}" --include "timeline-rediff.json" \
               --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
               --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
               --s3-no-check-bucket --log-level ERROR | grep -q timeline-rediff.json; then
            SRC=timeline-rediff.json
          else
            SRC=timeline.json
          fi
          echo "Timeline source: $SRC"
          rclone copyto ":s3:${R2_BUCKET}/$SRC" work/timeline.json \
            --ignore-size \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR
          rclone copyto ":s3:${R2_BUCKET}/palette.json" work/palette.json \
            --ignore-size \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR

      - name: List existing artifacts and R2 PNGs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DATE: ${{ inputs.date }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"snap-${DATE}_\")) | select(.expired == false) | .name" \
            > work/artifacts.txt
          echo "Existing snap-${DATE}_* artifacts: $(wc -l < work/artifacts.txt)"

          rclone lsf ":s3:${R2_BUCKET}" \
            --include "wdpsnapshot_${DATE}_*.png" \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR > work/r2_pngs.txt
          echo "PNGs on R2 for $DATE: $(wc -l < work/r2_pngs.txt)"

      - name: Determine plan
        id: determine
        env:
          DATE: ${{ inputs.date }}
          STOP_BEFORE: ${{ inputs.stop_before }}
          FORCE: ${{ inputs.force }}
          SKIP_TIMESTAMPS: ${{ inputs.skip_timestamps }}
        run: |
          python3 -u <<'PY'
          import json, os, sys

          day = os.environ['DATE']
          stop = os.environ['STOP_BEFORE'] or ''
          force = os.environ['FORCE'].lower() == 'true'
          skip_raw = os.environ.get('SKIP_TIMESTAMPS') or ''
          skip = {s.strip() for s in skip_raw.split(',') if s.strip()}

          timeline = json.load(open('work/timeline.json'))

          existing = set()
          for line in open('work/artifacts.txt'):
              line = line.strip()
              if not line: continue
              if line.startswith(f'snap-{day}_'):
                  existing.add(line[len('snap-'):])

          r2_pngs = set()
          for line in open('work/r2_pngs.txt'):
              name = line.strip()
              if name.startswith('wdpsnapshot_') and name.endswith('.png'):
                  r2_pngs.add(name[len('wdpsnapshot_'):-len('.png')])

          entries = sorted(
              [e for e in timeline if e['time'].startswith(day)],
              key=lambda e: e['time'],
          )
          if stop:
              entries = [e for e in entries if e['time'] < stop]
          if not entries:
              print(f"ERROR: no entries for {day}" + (f" < {stop}" if stop else ""))
              sys.exit(1)

          if skip:
              before = len(entries)
              entries = [e for e in entries if e['time'] not in skip]
              print(f"Protected (skipping) {before - len(entries)} timestamp(s): {sorted(skip)}")
              if not entries:
                  print("ERROR: no entries remain after skip filter")
                  sys.exit(1)

          plan = []
          counts = {'total': len(entries), 'skip': 0, 'copy': 0, 'reconstruct': 0}
          for e in entries:
              ts = e['time']
              if not force and ts in existing:
                  counts['skip'] += 1
                  continue
              if ts in r2_pngs:
                  plan.append({'time': ts, 'mode': 'copy',
                               'src': f'wdpsnapshot_{ts}.png', 'base': None})
                  counts['copy'] += 1
              elif e['kind'] == 'diff':
                  plan.append({'time': ts, 'mode': 'reconstruct',
                               'src': e['src'], 'base': e.get('base')})
                  counts['reconstruct'] += 1
              else:
                  print(f"ERROR: entry {ts} is a PNG but not on R2 — "
                        f"cannot copy, cannot reconstruct")
                  sys.exit(1)

          print(f"Day {day}{' < ' + stop if stop else ''}: "
                f"{counts['total']} total, {counts['skip']} skip (force=false), "
                f"{counts['copy']} copy, {counts['reconstruct']} reconstruct")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"missing={json.dumps(plan)}\n")
              f.write(f"empty={'true' if not plan else 'false'}\n")
          PY

  reconstruct:
    needs: determine
    if: needs.determine.outputs.empty == 'false' && inputs.dry_run == false
    strategy:
      matrix:
        snapshot: ${{ fromJson(needs.determine.outputs.missing) }}
      max-parallel: 20
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 -m pip install --quiet pillow numpy brotli

      - name: Install rclone
        run: |
          curl -fsSL -o rclone.deb https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone.deb
          rm -f rclone.deb

      - name: Download palette
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p work out
          rclone copyto ":s3:${R2_BUCKET}/palette.json" work/palette.json \
            --ignore-size \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR

      - name: Reconstruct or copy
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SNAPSHOT: ${{ toJson(matrix.snapshot) }}
        run: |
          python3 -u <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          import numpy as np
          from PIL import Image
          import brotli

          env = {k: os.environ[k] for k in
                 ('R2_ENDPOINT','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_BUCKET')}
          item = json.loads(os.environ['SNAPSHOT'])
          ts = item['time']
          out_file = Path(f'out/wdpsnapshot_{ts}.png')

          TR_RGB = np.array([0x47, 0x70, 0x4c], dtype=np.uint8)
          BAD_RGB = np.array([0x76, 0x63, 0x4b], dtype=np.uint8)

          def dl(remote, local):
              local = Path(local)
              if local.exists(): return
              local.parent.mkdir(parents=True, exist_ok=True)
              r = subprocess.run(
                  ['rclone', 'copyto', f':s3:{env["R2_BUCKET"]}/{remote}', str(local),
                   '--ignore-size',
                   '--s3-provider=Cloudflare', f'--s3-endpoint={env["R2_ENDPOINT"]}',
                   f'--s3-access-key-id={env["R2_ACCESS_KEY_ID"]}',
                   f'--s3-secret-access-key={env["R2_SECRET_ACCESS_KEY"]}',
                   '--s3-no-check-bucket', '--log-level', 'ERROR'],
                  capture_output=True, text=True)
              if r.returncode != 0 or not local.exists():
                  sys.exit(f"rclone failed for {remote}: {r.stderr}")

          def read_diff(path):
              raw = Path(path).read_bytes()
              try: return json.loads(brotli.decompress(raw))
              except Exception: return json.loads(raw)

          def hex_to_rgb(h):
              return int(h[1:3], 16), int(h[3:5], 16), int(h[5:7], 16)

          def apply_diff(arr, diff, palette):
              if 'rows' in diff:
                  for y, x_start, runs in diff['rows']:
                      x = x_start
                      for idx, length in runs:
                          r, g, b = hex_to_rgb(palette[idx])
                          arr[y, x:x+length, 0] = r
                          arr[y, x:x+length, 1] = g
                          arr[y, x:x+length, 2] = b
                          x += length
              elif 'changes' in diff:
                  for x, y, idx in diff['changes']:
                      if isinstance(idx, str):
                          r, g, b = hex_to_rgb(idx)
                      else:
                          r, g, b = hex_to_rgb(palette[idx])
                      arr[y, x, 0] = r; arr[y, x, 1] = g; arr[y, x, 2] = b
              else:
                  raise SystemExit(f"Unknown diff format: {diff.get('format')}")

          def enforce_alpha(arr):
              rgb = arr[:, :, :3]
              mask = np.all(rgb == TR_RGB, axis=2)
              alpha = np.where(mask, 0, 255).astype(np.uint8)
              return np.dstack([rgb, alpha])

          if item['mode'] == 'copy':
              src = item['src']
              local = Path('work') / src
              dl(src, local)
              arr = np.array(Image.open(local).convert('RGBA'))
              arr = enforce_alpha(arr)
              Image.fromarray(arr, 'RGBA').save(out_file, optimize=True)
              transparent = int((arr[:, :, 3] == 0).sum())
              print(f"Copied {src}: {transparent} transparent px")
              if transparent == 0:
                  raise SystemExit(
                      f"::error::Copied {src} has no #47704c pixels — "
                      f"source PNG on R2 is broken"
                  )
          else:
              diff_name = item['src']
              base_time = item['base']
              if base_time is None:
                  raise SystemExit(f"ERROR: no base for {ts}")

              base_src = f'wdpsnapshot_{base_time}.png'
              base_local = Path('work') / base_src
              dl(base_src, base_local)

              arr = np.array(Image.open(base_local).convert('RGBA'))
              diff_local = Path('work') / diff_name
              dl(diff_name, diff_local)
              diff = read_diff(diff_local)
              palette = json.load(open('work/palette.json'))

              apply_diff(arr, diff, palette)
              arr = enforce_alpha(arr)
              Image.fromarray(arr, 'RGBA').save(out_file, optimize=True)

              transparent = int((arr[:, :, 3] == 0).sum())
              print(f"Reconstructed {ts} (base {base_time}): "
                    f"{transparent} transparent px")

              if transparent == 0:
                  raise SystemExit(
                      f"::error::{ts} has no #47704c pixels after reconstruction — "
                      f"base {base_time} or diff may be corrupt"
                  )

          final = np.array(Image.open(out_file).convert('RGBA'))
          if not (final[:, :, 3] < 255).any():
              raise SystemExit(f"::error::{out_file.name} has no transparency")
          bad = int(np.all(final[:, :, :3] == BAD_RGB, axis=2).sum())
          if bad:
              raise SystemExit(f"::error::{out_file.name} contains #76634b "
                               f"({bad} px) — run Fix Artifact Colors first")
          print(f"✓ {out_file.name} ({out_file.stat().st_size} bytes) "
                f"has alpha, no #76634b")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.snapshot.time }}
          path: out/wdpsnapshot_${{ matrix.snapshot.time }}.png
          retention-days: 90
          if-no-files-found: error
          overwrite: true

  cleanup:
    needs: reconstruct
    if: always() && needs.reconstruct.result == 'success' && inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete duplicate snap-* artifacts (keep newest per name)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAY: ${{ inputs.date }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"snap-${DAY}_\")) | select(.expired == false) | \"\(.name) \(.created_at) \(.id)\"" \
            | sort -k1,1 -k2,2r \
            | awk '!seen[$1]++ { next } { print $3 }' \
            > to-delete.txt

          count=$(wc -l < to-delete.txt)
          echo "Duplicates to delete: $count"
          if [ "$count" -eq 0 ]; then
            echo "No duplicates — nothing to do"
            exit 0
          fi

          fail=0
          while read -r id; do
            [ -z "$id" ] && continue
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1; then
              echo "✓ Deleted $id"
            else
              echo "✗ Failed to delete $id"
              fail=$((fail+1))
            fi
          done < to-delete.txt

          if [ "$fail" -gt 0 ]; then
            echo "::error::$fail deletion(s) failed"
            exit 1
          fi

      - name: Verify exactly one per name remains
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAY: ${{ inputs.date }}
        run: |
          set -euo pipefail
          dupes=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"snap-${DAY}_\")) | select(.expired==false) | .name" \
            | sort | uniq -d || true)
          if [ -n "$dupes" ]; then
            echo "::warning::Still duplicated after cleanup:"
            echo "$dupes"
          else
            echo "✓ Every snap-${DAY}_* name has exactly one artifact"
          fi
