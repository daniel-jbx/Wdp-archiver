name: Reconstruct snap artifacts for a day

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to reconstruct (YYYYMMDD)'
        required: true
      dry_run:
        description: 'List what would be done, no reconstruction'
        type: boolean
        default: true

concurrency:
  group: reconstruct-snap-${{ inputs.date }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  determine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      missing: ${{ steps.determine.outputs.missing }}
    steps:
      - name: Install rclone and pngquant
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pngquant
          
      - name: Download timeline
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p work
          rclone copyto ":s3:${R2_BUCKET}/timeline.json" work/timeline.json \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR

      - name: List existing artifacts and R2 PNGs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DATE: ${{ inputs.date }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"snap-${DATE}_\")) | select(.expired == false) | .name" \
            > work/artifacts.txt
          echo "Existing snap-${DATE}_* artifacts: $(wc -l < work/artifacts.txt)"

          rclone lsf ":s3:${R2_BUCKET}" \
            --include "wdpsnapshot_${DATE}_*.png" \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR > work/r2_pngs.txt
          echo "PNGs on R2 for $DATE: $(wc -l < work/r2_pngs.txt)"

      - name: Determine missing snapshots
        id: determine
        env:
          DATE: ${{ inputs.date }}
        run: |
          python3 -u << 'PY'
          import json, os

          day = os.environ['DATE']
          timeline = json.load(open('work/timeline.json'))

          covered = set()
          for line in open('work/artifacts.txt'):
              name = line.strip()
              if name.startswith(f'snap-{day}_'):
                  covered.add(name[5:])

          r2_pngs = set()
          for line in open('work/r2_pngs.txt'):
              name = line.strip()
              if name.startswith('wdpsnapshot_') and name.endswith('.png'):
                  r2_pngs.add(name[len('wdpsnapshot_'):-len('.png')])

          day_entries = sorted(
              [e for e in timeline if e['time'].startswith(day)],
              key=lambda e: e['time']
          )
          if not day_entries:
              print(f"ERROR: no entries for {day}")
              raise SystemExit(1)

          missing = []
          counts = {'total': len(day_entries), 'covered': 0, 'copy': 0, 'reconstruct': 0}

          for e in day_entries:
              ts = e['time']
              if ts in covered:
                  counts['covered'] += 1
                  continue
              if ts in r2_pngs:
                  missing.append({'time': ts, 'mode': 'copy', 'src': f'wdpsnapshot_{ts}.png'})
                  counts['copy'] += 1
              else:
                  missing.append({
                      'time': ts,
                      'mode': 'reconstruct',
                      'src': e['src'],
                      'base': e.get('base') if e['kind'] == 'diff' else None,
                  })
                  counts['reconstruct'] += 1

          print(f"Day {day}: {counts['total']} total, {counts['covered']} covered, "
                f"{counts['copy']} copy-from-R2, {counts['reconstruct']} reconstruct")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"missing={json.dumps(missing)}\n")
          PY

  reconstruct:
    needs: determine
    if: needs.determine.outputs.missing != '[]' && inputs.dry_run == false
    strategy:
      matrix:
        snapshot: ${{ fromJson(needs.determine.outputs.missing) }}
      max-parallel: 20
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 -m pip install --quiet pillow numpy brotli

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb

      - name: Download palette
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p work out
          rclone copyto ":s3:${R2_BUCKET}/palette.json" work/palette.json \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR

      - name: Reconstruct or copy
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SNAPSHOT: ${{ toJson(matrix.snapshot) }}
        run: |
          python3 -u << 'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          import numpy as np
          from PIL import Image
          import brotli

          env = {k: os.environ[k] for k in (
              'R2_ENDPOINT', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_BUCKET')}
          item = json.loads(os.environ['SNAPSHOT'])
          ts = item['time']
          out_file = Path(f'out/wdpsnapshot_{ts}.png')

          def dl(remote, local):
              local = Path(local)
              if local.exists():
                  return
              local.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(
                  ['rclone', 'copyto',
                   f':s3:{env["R2_BUCKET"]}/{remote}', str(local),
                   '--ignore-size',
                   '--s3-provider=Cloudflare',
                   f'--s3-endpoint={env["R2_ENDPOINT"]}',
                   f'--s3-access-key-id={env["R2_ACCESS_KEY_ID"]}',
                   f'--s3-secret-access-key={env["R2_SECRET_ACCESS_KEY"]}',
                   '--s3-no-check-bucket', '--log-level', 'ERROR'],
                  check=True)

          def read_diff(path):
              raw = Path(path).read_bytes()
              try:
                  return json.loads(brotli.decompress(raw))
              except Exception:
                  return json.loads(raw)

          def hex_to_rgb(h):
              return int(h[1:3], 16), int(h[3:5], 16), int(h[5:7], 16)

          def apply_diff(arr, diff, palette):
              if 'rows' in diff:
                  for y, x_start, runs in diff['rows']:
                      x = x_start
                      for idx, length in runs:
                          r, g, b = hex_to_rgb(palette[idx])
                          arr[y, x:x+length, 0] = r
                          arr[y, x:x+length, 1] = g
                          arr[y, x:x+length, 2] = b
                          x += length
              elif 'changes' in diff:
                  for x, y, idx in diff['changes']:
                      r, g, b = hex_to_rgb(palette[idx])
                      arr[y, x, 0] = r
                      arr[y, x, 1] = g
                      arr[y, x, 2] = b

          if item['mode'] == 'copy':
              src = item['src']
              local = Path('work') / src
              dl(src, local)
              shutil.copy(local, out_file)
              print(f"Copied {src}")
          else:
              palette = json.load(open('work/palette.json'))
              base_time = item['base']
              if base_time is None:
                  # png entry, shouldn't reach here in reconstruct mode
                  raise SystemExit(f"ERROR: no base for {ts}")

              # Base PNG may be missing from timeline (orphaned), but file exists on R2
              base_src = f'wdpsnapshot_{base_time}.png'
              base_local = Path('work') / base_src
              dl(base_src, base_local)

              arr = np.array(Image.open(base_local).convert('RGBA'))

              diff_local = Path('work') / item['src']
              dl(item['src'], diff_local)
              diff = read_diff(diff_local)
              apply_diff(arr, diff, palette)

              Image.fromarray(arr, 'RGBA').save(out_file)
              subprocess.run(
                  ['pngquant', '--quality=100', '--speed=1', '--force', '64',
                   str(out_file), '--output', str(out_file)],
                  check=True)
              print(f"Reconstructed {ts} (base {base_time}) → {out_file.stat().st_size} bytes")

          print(f"Size: {out_file.stat().st_size} bytes")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.snapshot.time }}
          path: out/wdpsnapshot_${{ matrix.snapshot.time }}.png
          retention-days: 90
          if-no-files-found: error
          overwrite: true
