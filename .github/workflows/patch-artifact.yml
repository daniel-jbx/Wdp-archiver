name: Patch Specific Artifact From Reference

# Replaces snap-<target_ts> with a corrected version built from snap-<reference_ts>
# (which must be verified clean). Patches each pixel where the target artifact
# differs from the reference at positions the buggy diff wrote black, then
# enforces alpha (transparent where #47704c).
#
# One-shot per timestamp. Run with reference_ts = a snapshot verified clean and
# base_ts = the chain base that the target's diff references.

on:
  workflow_dispatch:
    inputs:
      target_ts:
        description: 'Buggy timestamp to patch (YYYYMMDD_HHMMSS)'
        required: true
      reference_ts:
        description: 'Clean reference timestamp (YYYYMMDD_HHMMSS)'
        required: true
      base_ts:
        description: 'Chain base for the target diff (YYYYMMDD_HHMMSS)'
        required: true

permissions:
  contents: read
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow numpy brotli

      - name: Install rclone
        run: |
          curl -fsSL -o rclone.deb https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone.deb
          rm -f rclone.deb

      - name: Download from R2 + current artifact
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ inputs.target_ts }}
          REF: ${{ inputs.reference_ts }}
          BASE: ${{ inputs.base_ts }}
        run: |
          set -euo pipefail
          mkdir -p work out

          echo "Inputs: BASE=$BASE  TARGET=$TARGET  REF=$REF"
          echo "R2 bucket: ${R2_BUCKET:0:8}…"

          rclone_get() {
            local remote="$1"
            local dest="$2"
            echo "── pulling $remote → $dest"
            command rclone copyto ":s3:${R2_BUCKET}/$remote" "$dest" \
              --ignore-size \
              --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
              --s3-access-key-id="$R2_ACCESS_KEY_ID" \
              --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --s3-no-check-bucket --log-level ERROR
            local rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::rclone failed for $remote (exit=$rc)"
              return "$rc"
            fi
            if [ ! -s "$dest" ]; then
              echo "::error::$dest is missing or zero-length after rclone"
              return 1
            fi
            echo "   ✓ $(wc -c < "$dest") bytes"
          }

          rclone_get "wdpsnapshot_${BASE}.png" work/base.png
          rclone_get "wdpdiff_${TARGET}.json"  work/target.json
          rclone_get "wdpdiff_${REF}.json"     work/ref.json
          rclone_get "palette.json"            work/palette.json

          echo "── work/ contents after download:"
          ls -la work/

          ART_ID=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"snap-${TARGET}\") | select(.expired==false) | \"\(.created_at) \(.id)\"" \
            | sort -r | head -1 | awk '{print $2}')
          if [ -z "$ART_ID" ]; then
            echo "::error::No artifact found for snap-${TARGET}"
            exit 1
          fi
          echo "── downloading artifact $ART_ID"
          curl -sL -f -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/${ART_ID}/zip" \
            -o work/target_artifact.zip
          python3 -c "import zipfile; zipfile.ZipFile('work/target_artifact.zip').extractall('work/extracted')"

          echo "── extracted PNGs:"
          find work/extracted -name "*.png"

          echo "── final work/ state:"
          ls -la work/

      - name: Patch artifact
        env:
          TARGET: ${{ inputs.target_ts }}
        run: |
          python3 -u <<'PY'
          import os, json, brotli
          from pathlib import Path
          import numpy as np
          from PIL import Image

          def read_diff(p):
              raw = Path(p).read_bytes()
              try: return json.loads(brotli.decompress(raw))
              except: return json.loads(raw)

          def hex_to_rgb(h): return int(h[1:3],16),int(h[3:5],16),int(h[5:7],16)

          def apply_diff(arr, d, palette):
              if 'rows' in d:
                  for y,x0,runs in d['rows']:
                      x=x0
                      for idx,length in runs:
                          r,g,b = hex_to_rgb(palette[idx])
                          arr[y,x:x+length,:3]=[r,g,b]
                          x+=length
              elif 'changes' in d:
                  for x,y,idx in d['changes']:
                      if isinstance(idx,str): r,g,b=hex_to_rgb(idx)
                      else: r,g,b=hex_to_rgb(palette[idx])
                      arr[y,x,:3]=[r,g,b]

          def enforce_alpha(arr):
              TR = np.array([0x47,0x70,0x4c],dtype=np.uint8)
              m = np.all(arr[:,:,:3]==TR,axis=2)
              arr[:,:,3] = np.where(m,0,255).astype(np.uint8)
              return arr

          palette = json.load(open('work/palette.json'))
          target_ts = os.environ['TARGET']

          print('Reconstructing reference (clean)…')
          A = np.array(Image.open('work/base.png').convert('RGBA'))
          apply_diff(A, read_diff('work/ref.json'), palette)
          A = enforce_alpha(A)

          print('Reconstructing buggy target (to infer bad positions)…')
          B = np.array(Image.open('work/base.png').convert('RGBA'))
          apply_diff(B, read_diff('work/target.json'), palette)
          B = enforce_alpha(B)

          print('Loading current artifact…')
          pngs = list(Path('work/extracted').rglob('*.png'))
          if not pngs: raise SystemExit('No PNG in target artifact')
          art = np.array(Image.open(pngs[0]).convert('RGBA'))
          print(f'  {art.shape[1]}x{art.shape[0]}')

          is_black    = np.all(B[:,:,:3] == np.array([0,0,0],dtype=np.uint8), axis=2)
          is_diff     = np.any(A[:,:,:3] != B[:,:,:3], axis=2)
          ref_not_blk = np.any(A[:,:,:3] != np.array([0,0,0],dtype=np.uint8), axis=2)
          bad         = is_black & is_diff & ref_not_blk
          ys, xs = np.where(bad)
          print(f'Bad positions (diff wrote black, reference differs): {len(xs):,}')

          patched = 0
          for y, x in zip(ys.tolist(), xs.tolist()):
              if tuple(art[y,x,:3]) == (0,0,0) and tuple(A[y,x,:3]) != (0,0,0):
                  art[y,x,:3] = A[y,x,:3]
                  patched += 1
          print(f'Patched {patched:,} pixels from reference')

          art = enforce_alpha(art)

          rem = int(np.all(art[:,:,:3] == np.array([0,0,0],dtype=np.uint8), axis=2).sum())
          print(f'After:')
          print(f'  black px:     {rem}')
          print(f'  has alpha:    {bool((art[:,:,3]<255).any())}')
          print(f'  unique colors:{len(np.unique(art[:,:,:3].reshape(-1,3), axis=0))}')

          out = Path('out') / f'wdpsnapshot_{target_ts}.png'
          Image.fromarray(art, 'RGBA').save(out, optimize=True)
          print(f'Saved {out} ({out.stat().st_size} bytes)')
          PY

      - name: Upload as new artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ inputs.target_ts }}
          path: out/wdpsnapshot_${{ inputs.target_ts }}.png
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Delete old duplicate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ART_NAME: snap-${{ inputs.target_ts }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"$ART_NAME\") | select(.expired==false) | \"\(.created_at) \(.id)\"" \
            | sort -r | tail -n +2 | awk '{print $2}' > to-delete.txt
          count=$(wc -l < to-delete.txt)
          echo "Deleting $count old artifact(s) of $ART_NAME"
          while read -r id; do
            [ -z "$id" ] && continue
            echo "  Deleting $id"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true
          done < to-delete.txt
