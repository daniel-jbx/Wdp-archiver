name: Patch Specific Artifact (cross-checked)

# Like the earlier version, but uses a fixed later timestamp (182555 for
# 180124) as an additional reference. The bug mask becomes:
#   A.rgb == C.rgb  AND  B.rgb == black  AND  A.rgb != black
# which excludes legitimate terrain edits (blue→black) that also appear
# black in the buggy reconstruction.
#
# Rebuilds the artifact from B (reconstruction) + A (reference) rather than
# patching the existing artifact in place, so any earlier mis-patch is undone.

on:
  workflow_dispatch:
    inputs:
      target_ts:
        description: 'Buggy timestamp'
        required: true
      reference_ts:
        description: 'Clean reference timestamp (earlier)'
        required: true
      base_ts:
        description: 'Chain base for target diff'
        required: true
      fixed_later_ts:
        description: 'Fixed timestamp on R2 to cross-check (the fixed promotion point)'
        required: true

permissions:
  contents: read
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow numpy brotli

      - name: Install rclone
        run: |
          curl -fsSL -o rclone.deb https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone.deb
          rm -f rclone.deb

      - name: Download inputs
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ inputs.target_ts }}
          REF: ${{ inputs.reference_ts }}
          BASE: ${{ inputs.base_ts }}
          FIXED_LATER: ${{ inputs.fixed_later_ts }}
        run: |
          set -euo pipefail
          mkdir -p work out

          rclone_get() {
            command rclone copyto ":s3:${R2_BUCKET}/$1" "$2" \
              --ignore-size \
              --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
              --s3-access-key-id="$R2_ACCESS_KEY_ID" \
              --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --s3-no-check-bucket --log-level ERROR
            [ -s "$2" ] || { echo "::error::rclone failed for $1"; exit 1; }
          }

          rclone_get "wdpsnapshot_${BASE}.png"           work/base.png
          rclone_get "wdpdiff_${TARGET}.json"            work/target.json
          rclone_get "wdpdiff_${REF}.json"               work/ref.json
          rclone_get "wdpsnapshot_${FIXED_LATER}.png"    work/fixed_later.png
          rclone_get "palette.json"                      work/palette.json

          ART_ID=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"snap-${TARGET}\") | select(.expired==false) | \"\(.created_at) \(.id)\"" \
            | sort -r | head -1 | awk '{print $2}')
          echo "Current artifact: $ART_ID (will be replaced)"

      - name: Rebuild and patch
        env:
          TARGET: ${{ inputs.target_ts }}
        run: |
          python3 -u <<'PY'
          import os, json, brotli
          from pathlib import Path
          import numpy as np
          from PIL import Image

          def read_diff(p):
              raw = Path(p).read_bytes()
              try: return json.loads(brotli.decompress(raw))
              except: return json.loads(raw)

          def hex_to_rgb(h): return int(h[1:3],16),int(h[3:5],16),int(h[5:7],16)

          def apply_diff(arr, d, palette):
              if 'rows' in d:
                  for y,x0,runs in d['rows']:
                      x=x0
                      for idx,length in runs:
                          r,g,b = hex_to_rgb(palette[idx])
                          arr[y,x:x+length,:3]=[r,g,b]
                          x+=length
              elif 'changes' in d:
                  for x,y,idx in d['changes']:
                      if isinstance(idx,str): r,g,b=hex_to_rgb(idx)
                      else: r,g,b=hex_to_rgb(palette[idx])
                      arr[y,x,:3]=[r,g,b]

          def enforce_alpha(arr):
              TR = np.array([0x47,0x70,0x4c],dtype=np.uint8)
              m = np.all(arr[:,:,:3]==TR,axis=2)
              arr[:,:,3] = np.where(m,0,255).astype(np.uint8)
              return arr

          palette = json.load(open('work/palette.json'))
          target_ts = os.environ['TARGET']

          print('Reconstructing A (reference, clean)…')
          A = np.array(Image.open('work/base.png').convert('RGBA'))
          apply_diff(A, read_diff('work/ref.json'), palette)
          A = enforce_alpha(A)

          print('Reconstructing B (target, has bug)…')
          B = np.array(Image.open('work/base.png').convert('RGBA'))
          apply_diff(B, read_diff('work/target.json'), palette)
          B = enforce_alpha(B)

          print('Loading C (fixed later timestamp)…')
          C = np.array(Image.open('work/fixed_later.png').convert('RGBA'))
          C = enforce_alpha(C)

          # True bug mask: A and C agree on a non-black color, but B is black
          rgb_eq_ac = np.all(A[:,:,:3] == C[:,:,:3], axis=2)
          b_is_blk  = np.all(B[:,:,:3] == np.array([0,0,0],dtype=np.uint8), axis=2)
          a_not_blk = np.any(A[:,:,:3] != np.array([0,0,0],dtype=np.uint8), axis=2)
          true_bad  = rgb_eq_ac & b_is_blk & a_not_blk
          ys, xs = np.where(true_bad)
          print(f'TRUE bug positions: {len(xs):,}')

          # Also report the excluded set for sanity
          a_ne_c = ~rgb_eq_ac
          excluded = b_is_blk & a_not_blk & a_ne_c
          print(f'Excluded (A!=C but B=black, A!=black): {int(excluded.sum()):,}')
          if excluded.any():
              from collections import Counter
              excl_c = Counter()
              for y, x in zip(*np.where(excluded)):
                  excl_c[(tuple(int(v) for v in A[y,x,:3]), tuple(int(v) for v in C[y,x,:3]))] += 1
              for (ac, cc), n in excl_c.most_common(5):
                  print(f'  A=#{ac[0]:02x}{ac[1]:02x}{ac[2]:02x} C=#{cc[0]:02x}{cc[1]:02x}{cc[2]:02x}: {n}')

          # Build new artifact from B, patch the true-bad positions with A
          new_art = B.copy()
          for y, x in zip(ys.tolist(), xs.tolist()):
              new_art[y, x, :3] = A[y, x, :3]
          new_art = enforce_alpha(new_art)

          # Sanity
          rem = int(np.all(new_art[:,:,:3] == np.array([0,0,0],dtype=np.uint8), axis=2).sum())
          a_blk = int(np.all(A[:,:,:3] == np.array([0,0,0],dtype=np.uint8), axis=2).sum())
          print(f'\nVerification:')
          print(f'  new_art black px: {rem:,}')
          print(f'  A (174605) black px: {a_blk:,}')
          print(f'  difference: {abs(rem - a_blk):,}')
          print(f'  has alpha: {bool((new_art[:,:,3]<255).any())}')
          print(f'  unique colors: {len(np.unique(new_art[:,:,:3].reshape(-1,3), axis=0))}')

          out = Path('out') / f'wdpsnapshot_{target_ts}.png'
          Image.fromarray(new_art, 'RGBA').save(out, optimize=True)
          print(f'Saved {out} ({out.stat().st_size} bytes)')
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ inputs.target_ts }}
          path: out/wdpsnapshot_${{ inputs.target_ts }}.png
          retention-days: 90
          if-no-files-found: error
          overwrite: true

      - name: Delete old duplicates
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ART_NAME: snap-${{ inputs.target_ts }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"$ART_NAME\") | select(.expired==false) | \"\(.created_at) \(.id)\"" \
            | sort -r | tail -n +2 | awk '{print $2}' > to-delete.txt
          count=$(wc -l < to-delete.txt)
          echo "Deleting $count old artifact(s)"
          while read -r id; do
            [ -z "$id" ] && continue
            echo "  Deleting $id"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true
          done < to-delete.txt
