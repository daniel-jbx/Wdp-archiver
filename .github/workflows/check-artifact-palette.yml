name: Check Artifact Palette

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to check (YYYYMMDD)'
        required: true
        default: '20261104'

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install rclone and python deps
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb
          python3 -m pip install --quiet pillow numpy

      - name: Download canonical palette
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p work artifacts
          rclone copyto ":s3:${R2_BUCKET}/palette.json" work/palette.json \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR

      - name: Find and download ALL sample artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DATE: ${{ inputs.date }}
        run: |
          # Get ALL artifact IDs for this date (removed the head -n 5)
          ARTIFACT_IDS=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"snap-${DATE}_\")) | select(.expired == false) | .id")
          
          COUNT=$(echo "$ARTIFACT_IDS" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "No artifacts found for $DATE"
            exit 1
          fi

          echo "Found $COUNT artifacts. Downloading all..."
          i=0
          for id in $ARTIFACT_IDS; do
            i=$((i + 1))
            curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/${id}/zip" \
              -o "artifacts/${id}.zip"
            unzip -q -o "artifacts/${id}.zip" -d artifacts/
            rm "artifacts/${id}.zip"
            if [ $((i % 20)) -eq 0 ]; then
              echo "  Downloaded $i of $COUNT..."
            fi
          done

      - name: Verify unique colors for ALL artifacts
        run: |
          python3 -u << 'PY'
          import json, sys
          from pathlib import Path
          import numpy as np
          from PIL import Image

          palette = json.load(open('work/palette.json'))
          # Pack canonical palette into uint32
          canonical_packed = set()
          for h in palette:
              r = int(h[1:3], 16); g = int(h[3:5], 16); b = int(h[5:7], 16)
              canonical_packed.add((r << 16) | (g << 8) | b)

          pngs = list(Path('artifacts').glob('*.png'))
          print(f"Checking all {len(pngs)} snapshots (fast mode)...")
          
          failed_files = []
          
          for png in pngs:
              arr = np.array(Image.open(png).convert('RGB'))
              # Pack image into uint32
              packed = (arr[:, :, 0].astype(np.uint32) << 16) | \
                       (arr[:, :, 1].astype(np.uint32) << 8) | \
                       arr[:, :, 2].astype(np.uint32)
              unique_packed = np.unique(packed)
              
              for p in unique_packed:
                  if int(p) not in canonical_packed:
                      hex_c = '#%06x' % p
                      failed_files.append((png.name, hex_c))
                      break # No need to check other colors in this file if one is bad

          if failed_files:
              print(f"\n❌ VERDICT: FAILED. {len(failed_files)} artifacts contain non-canonical colors.")
              for name, hexc in failed_files:
                  print(f"  {name}: {hexc}")
              sys.exit(1)
          else:
              print("\n✅ VERDICT: PASSED. All artifacts are perfectly canonical.")
          PY
