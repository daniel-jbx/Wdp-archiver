name: Backup R2 to Release

on:
  workflow_dispatch:

concurrency:
  group: backup-r2-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      months: ${{ steps.list.outputs.months }}
    steps:
      - run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb

      - id: list
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -eo pipefail
          rclone lsf ":s3:${R2_BUCKET}" \
            --include "wdpsnapshot_*.png" \
            --include "wdpdiff_*.json" \
            --s3-provider=Cloudflare \
            --s3-endpoint="${R2_ENDPOINT}" \
            --s3-access-key-id="${R2_ACCESS_KEY_ID}" \
            --s3-secret-access-key="${R2_SECRET_ACCESS_KEY}" \
            --s3-no-check-bucket > /tmp/all_files.txt
          echo "Total files: $(wc -l < /tmp/all_files.txt)"
          {
            grep -oE '_[0-9]{8}_' /tmp/all_files.txt | grep -oE '[0-9]{8}' | cut -c1-6 | sort -u
            echo "_manifests"
          } | jq -R . | jq -s -c . > /tmp/months.json
          echo "Groups: $(cat /tmp/months.json)"
          echo "months=$(cat /tmp/months.json)" >> $GITHUB_OUTPUT

  backup:
    needs: discover
    strategy:
      matrix:
        month: ${{ fromJson(needs.discover.outputs.months) }}
      max-parallel: 3
      fail-fast: false
    runs-on: ubuntu-latest
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb

      - if: matrix.month != '_manifests'
        run: |
          mkdir -p archive
          rclone copy ":s3:${R2_BUCKET}" archive/ \
            --include "wdpsnapshot_${{ matrix.month }}*.png" \
            --include "wdpdiff_${{ matrix.month }}*.json" \
            --s3-provider=Cloudflare \
            --s3-endpoint="${R2_ENDPOINT}" \
            --s3-access-key-id="${R2_ACCESS_KEY_ID}" \
            --s3-secret-access-key="${R2_SECRET_ACCESS_KEY}" \
            --s3-no-check-bucket --transfers 8
          echo "Downloaded: $(ls archive/ | wc -l) files, $(du -sh archive/ | cut -f1)"
          cd archive
          tar -cf - * | split -b 1800M - "/tmp/backup-${{ matrix.month }}.tar.part"
          cd ..
          rm -rf archive
          cd /tmp
          sha256sum backup-${{ matrix.month }}.tar.part* > backup-${{ matrix.month }}.sha256
          ls -lh backup-${{ matrix.month }}.tar.part*

      - if: matrix.month == '_manifests'
        run: |
          mkdir -p archive
          rclone copy ":s3:${R2_BUCKET}" archive/ \
            --include "timeline.json" \
            --include "palette.json" \
            --include "snapshots.json" \
            --s3-provider=Cloudflare \
            --s3-endpoint="${R2_ENDPOINT}" \
            --s3-access-key-id="${R2_ACCESS_KEY_ID}" \
            --s3-secret-access-key="${R2_SECRET_ACCESS_KEY}" \
            --s3-no-check-bucket

      - name: Delete existing release if present
        run: |
          tag="r2-backup-${{ matrix.month }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag --repo "${{ github.repository }}"
            sleep 3
          fi

      - if: matrix.month != '_manifests'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r2-backup-${{ matrix.month }}
          name: "R2 Archive ${{ matrix.month }}"
          files: |
            /tmp/backup-${{ matrix.month }}.tar.part*
            /tmp/backup-${{ matrix.month }}.sha256

      - if: matrix.month == '_manifests'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r2-backup-manifests
          name: "R2 Archive Manifests"
          files: archive/*
