name: Backfill day to diffs

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific day (YYYYMMDD). Leave empty to auto-pick next pending.'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — convert but no R2 writes'
        type: boolean
        default: false
  schedule:
    - cron: '1,2,3,4,16,17,18,19,31,32,33,34,46,47,48,49 * * * *'

concurrency:
  group: update-map
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            make-diffs.py
            backfill-day.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 -m pip install --quiet pillow numpy

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb

      - name: Download timeline and palette
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p day publish prior-base
          rclone copyto ":s3:${R2_BUCKET}/timeline.json" timeline.json \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket
          rclone copyto ":s3:${R2_BUCKET}/palette.json" palette.json \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket

      - name: Determine target day
        id: target
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "Mode: manual (${{ inputs.date }})"
            echo "day=${{ inputs.date }}" >> $GITHUB_OUTPUT
          else
            set +e
            day=$(python3 backfill-day.py --next-pending --main-timeline timeline.json)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "ERROR: next-pending exited with code $rc (crash or bug)"
              exit 1
            fi
            if [ -z "$day" ]; then
              echo "No pending days - all backfill complete."
              echo "day=" >> $GITHUB_OUTPUT
              echo "### All backfill complete" >> $GITHUB_STEP_SUMMARY
            else
              echo "Auto-picked next pending day: $day"
              echo "day=$day" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Download day's PNGs
        if: steps.target.outputs.day != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ":s3:${R2_BUCKET}" day/ \
            --include "wdpsnapshot_${{ steps.target.outputs.day }}_*.png" \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket
          echo "PNGs downloaded: $(ls day/*.png 2>/dev/null | wc -l)"

      - name: Prepare prior chain state
        if: steps.target.outputs.day != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TARGET_DAY: ${{ steps.target.outputs.day }}
        run: |
          python3 << 'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          timeline = json.load(open('timeline.json'))
          day = os.environ['TARGET_DAY']
          prior = [e for e in timeline if e['time'] < day + '_000000']
          base_entry = next((e for e in reversed(prior) if e['kind'] == 'png'), None)
          if base_entry is None:
              print("No prior base — new chain will start")
              sys.exit(0)
          last_diff = next((e for e in reversed(prior) if e['kind'] == 'diff'), None)
          env = {k: os.environ[k] for k in (
              'R2_ENDPOINT', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY', 'R2_BUCKET')}
          for fname in [base_entry['src']] + ([last_diff['src']] if last_diff else []):
              subprocess.run(
                  ['rclone', 'copyto',
                   f':s3:{env["R2_BUCKET"]}/{fname}', f'prior-base/{fname}',
                   '--s3-provider=Cloudflare',
                   f'--s3-endpoint={env["R2_ENDPOINT"]}',
                   f'--s3-access-key-id={env["R2_ACCESS_KEY_ID"]}',
                   f'--s3-secret-access-key={env["R2_SECRET_ACCESS_KEY"]}',
                   '--s3-no-check-bucket'], check=True)
          print(f"Prior base pre-downloaded: {base_entry['time']}")
          if last_diff:
              print(f"Prior last diff: {last_diff['time']}")
          PY

      - name: Run backfill conversion
        if: steps.target.outputs.day != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 backfill-day.py \
            --date "${{ steps.target.outputs.day }}" \
            --day-dir day \
            --main-timeline timeline.json \
            --canonical-palette palette.json \
            --publish-dir publish \
            --merged-timeline-out merged-timeline.json \
            --files-to-delete-out delete-list.txt \
            --prior-base-dir prior-base \
            --recheck-timeline

      - name: Effective mode
        id: mode
        if: steps.target.outputs.day != ''
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "dry_run=false" >> $GITHUB_OUTPUT
          else
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload base PNGs and diffs
        if: steps.target.outputs.day != '' && steps.mode.outputs.dry_run == 'false'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for f in publish/*.png publish/wdpdiff_*.json; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            rclone copyto "$f" ":s3:${R2_BUCKET}/${b}" \
              --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
              --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --s3-no-check-bucket
          done

      - name: Update main timeline
        if: steps.target.outputs.day != '' && steps.mode.outputs.dry_run == 'false'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copyto merged-timeline.json ":s3:${R2_BUCKET}/timeline.json" \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket

      - name: Delete original PNGs
        if: steps.target.outputs.day != '' && steps.mode.outputs.dry_run == 'false'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            rclone delete ":s3:${R2_BUCKET}/${f}" \
              --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
              --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --s3-no-check-bucket
          done < delete-list.txt

      - name: Upload artifact
        if: always() && steps.target.outputs.day != ''
        uses: actions/upload-artifact@v4
        with:
          name: backfill-${{ steps.target.outputs.day }}-${{ github.run_id }}
          path: |
            day/
            publish/
            merged-timeline.json
            delete-list.txt
          retention-days: 90
          if-no-files-found: warn
