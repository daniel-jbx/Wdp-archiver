name: Rediff a day

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Day to rediff (YYYYMMDD)'
        required: true
      source:
        description: 'auto: try release→artifact→reconstruct. release: require backup release. artifact: require GH Actions artifact. reconstruct: from current R2 bases+diffs.'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - release
          - artifact
          - reconstruct
      dry_run:
        description: 'Dry run — reconstruct and re-diff locally, no R2 writes'
        type: boolean
        default: false

concurrency:
  group: update-map
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  rediff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            make-diffs.py
            backfill-day.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 -m pip install --quiet pillow numpy

      - name: Install rclone (and pngquant best-effort)
        run: |
          timeout 300 curl -fsSL -o rclone.deb https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone.deb
          rm -f rclone.deb
          if ! command -v pngquant >/dev/null 2>&1; then
            timeout 300 sudo apt-get update -qq || true
            timeout 300 sudo apt-get install -y --no-install-recommends pngquant \
              || echo "WARN: pngquant unavailable; reconstruct path will fail if reached"
          fi

      - name: Download timeline and palette
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p assets day publish
          rclone copyto ":s3:${R2_BUCKET}/timeline.json" timeline.json \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR
          rclone copyto ":s3:${R2_BUCKET}/palette.json" palette.json \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR

      - name: Determine required files
        run: |
          python3 -u << 'PY'
          import json, sys
          timeline = json.load(open('timeline.json'))
          day = "${{ inputs.date }}"
          day_start = day + '_000000'
          day_end = day + '_999999'

          day_entries = [e for e in timeline if day_start <= e['time'] <= day_end]
          if not day_entries:
              print(f"ERROR: no entries for {day} in timeline")
              sys.exit(1)

          prior = [e for e in timeline if e['time'] < day_start]
          start_base = next((e for e in reversed(prior) if e['kind'] == 'png'), None)
          if start_base is None:
              start_base = next((e for e in day_entries if e['kind'] == 'png'), None)
              if start_base is None:
                  print("ERROR: no base found at or before target day")
                  sys.exit(1)

          start_idx = next(i for i, e in enumerate(timeline)
                           if e['time'] == start_base['time'] and e['kind'] == 'png')
          last_time = day_entries[-1]['time']
          end_idx = next(i for i, e in enumerate(timeline) if e['time'] == last_time)

          relevant = timeline[start_idx:end_idx+1]
          download_files = [e['src'] for e in relevant]
          old_day_files = [e['src'] for e in day_entries]

          with open('download-list.txt', 'w') as f:
              f.write('\n'.join(download_files))
          with open('old-day-files.txt', 'w') as f:
              f.write('\n'.join(old_day_files))

          print(f"Will download {len(download_files)} files")
          print(f"Day has {len(day_entries)} existing files (bases + diffs)")
          PY

      - name: Download prior base + last diff from R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ":s3:${R2_BUCKET}" assets/ \
            --files-from download-list.txt \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR
          echo "Downloaded $(ls assets/ | wc -l) files"

      - name: Try release archive
        id: release
        if: inputs.source == 'release' || inputs.source == 'auto'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          MONTH="${DATE:0:6}"
          TAG="r2-backup-${MONTH}"

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "No release $TAG for date $DATE"
            exit 1
          fi

          mkdir -p /tmp/archive
          cd /tmp/archive
          trap 'cd -; rm -f /tmp/archive/backup-*.tar.part* /tmp/archive/backup-*.sha256' EXIT

          gh release download "$TAG" --repo "$REPO" \
            --pattern "*.tar.part*" --pattern "*.sha256"

          if grep -q '\.tar\.part' "backup-${MONTH}.sha256"; then
            sha256sum -c "backup-${MONTH}.sha256"
          else
            EXPECTED=$(awk '{print $1}' "backup-${MONTH}.sha256")
            ACTUAL=$(cat backup-${MONTH}.tar.part* | sha256sum | awk '{print $1}')
            [ "$EXPECTED" = "$ACTUAL" ] && echo "Full-tar checksum OK" \
              || { echo "SHA256 mismatch"; exit 1; }
          fi

          rm -rf "$GITHUB_WORKSPACE/day"
          mkdir -p "$GITHUB_WORKSPACE/day"
          cat backup-${MONTH}.tar.part* | tar -xf - -C "$GITHUB_WORKSPACE/day" \
            --wildcards --no-anchored "wdpsnapshot_${DATE}_*.png"

          COUNT=$(ls "$GITHUB_WORKSPACE/day"/wdpsnapshot_${DATE}_*.png 2>/dev/null | wc -l)
          echo "Extracted $COUNT snapshots for $DATE from $TAG"
          if [ "$COUNT" -eq 0 ]; then
            echo "No snapshots in release for $DATE"
            exit 1
          fi
          if [ "$COUNT" -lt 2 ]; then
            echo "ERROR: only $COUNT PNG(s) for $DATE in release"
            echo "       Release likely postdates backfill — contains base+diffs, not originals"
            exit 1
          fi

      - name: Try artifact archive
        id: artifact
        if: |
          (inputs.source == 'artifact' || inputs.source == 'auto') &&
          steps.release.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"backfill-${DATE}-\")) | select(.expired == false) | \"\(.created_at) \(.id)\"" \
            | sort -r | head -1 | awk '{print $2}')

          if [ -z "${ARTIFACT_ID:-}" ]; then
            echo "No unexpired artifact matching backfill-${DATE}-*"
            exit 1
          fi
          echo "Using artifact ID: $ARTIFACT_ID"

          mkdir -p /tmp/artifact
          cd /tmp/artifact
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o artifact.zip
          unzip -q artifact.zip

          FOUND=$(find . -name "wdpsnapshot_${DATE}_*.png" | head -1)
          if [ -z "$FOUND" ]; then
            echo "Artifact does not contain wdpsnapshot_${DATE}_*.png"
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/day"
          mkdir -p "$GITHUB_WORKSPACE/day"
          find . -name "wdpsnapshot_${DATE}_*.png" -exec cp {} "$GITHUB_WORKSPACE/day/" \;

          COUNT=$(ls "$GITHUB_WORKSPACE/day"/*.png 2>/dev/null | wc -l)
          echo "Extracted $COUNT snapshots for $DATE from artifact $ARTIFACT_ID"
          if [ "$COUNT" -lt 2 ]; then
            echo "ERROR: only $COUNT PNG(s) in artifact"
            exit 1
          fi

      - name: Reconstruct PNGs from bases + diffs
        id: reconstruct
        if: |
          inputs.source == 'reconstruct' ||
          (inputs.source == 'auto' && steps.release.outcome != 'success' && steps.artifact.outcome != 'success')
        run: |
          python3 -u << 'PY'
          import json, sys
          from pathlib import Path
          import numpy as np
          from PIL import Image

          def hex_to_rgb(h):
              return int(h[1:3], 16), int(h[3:5], 16), int(h[5:7], 16)

          def apply_diff(arr_rgba, diff, palette):
              if 'rows' in diff:
                  for y, x_start, runs in diff['rows']:
                      x = x_start
                      for idx, length in runs:
                          r, g, b = hex_to_rgb(palette[idx])
                          arr_rgba[y, x:x+length, 0] = r
                          arr_rgba[y, x:x+length, 1] = g
                          arr_rgba[y, x:x+length, 2] = b
                          x += length
              elif 'changes' in diff:
                  for x, y, idx in diff['changes']:
                      r, g, b = hex_to_rgb(palette[idx])
                      arr_rgba[y, x, 0] = r
                      arr_rgba[y, x, 1] = g
                      arr_rgba[y, x, 2] = b

          timeline = json.load(open('timeline.json'))
          palette = json.load(open('palette.json'))
          day = "${{ inputs.date }}"
          day_start = day + '_000000'
          day_end = day + '_999999'

          day_entries = [e for e in timeline if day_start <= e['time'] <= day_end]
          prior = [e for e in timeline if e['time'] < day_start]
          start_base = next((e for e in reversed(prior) if e['kind'] == 'png'), None)
          if start_base is None:
              start_base = next((e for e in day_entries if e['kind'] == 'png'), None)

          start_idx = next(i for i, e in enumerate(timeline)
                           if e['time'] == start_base['time'] and e['kind'] == 'png')
          last_time = day_entries[-1]['time']
          end_idx = next(i for i, e in enumerate(timeline) if e['time'] == last_time)

          src_dir = Path('assets')
          out_dir = Path('day')
          out_dir.mkdir(exist_ok=True)

          base_cache = {}
          def get_base(src_name):
              if src_name not in base_cache:
                  base_cache[src_name] = np.array(Image.open(src_dir / src_name).convert('RGBA'))
              return base_cache[src_name].copy()

          for entry in timeline[start_idx:end_idx+1]:
              t = entry['time']
              if not t.startswith(day):
                  continue
              if entry['kind'] == 'png':
                  arr = np.array(Image.open(src_dir / entry['src']).convert('RGBA'))
                  Image.fromarray(arr, 'RGBA').save(out_dir / f"wdpsnapshot_{t}.png")
                  print(f"  Saved PNG (base): {t}")
              elif entry['kind'] == 'diff':
                  diff = json.load(open(src_dir / entry['src']))
                  base_entry = next((e for e in timeline if e['time'] == diff['base'] and e['kind'] == 'png'), None)
                  if base_entry is None:
                      print(f"ERROR: no base PNG for diff {entry['src']} (base={diff['base']})")
                      sys.exit(1)
                  base_arr = get_base(base_entry['src'])
                  apply_diff(base_arr, diff, palette)
                  Image.fromarray(base_arr, 'RGBA').save(out_dir / f"wdpsnapshot_{t}.png")
                  print(f"  Saved PNG (diff): {t}")

          count = len(list(out_dir.glob('*.png')))
          print(f"\nReconstructed {count} PNGs (expected {len(day_entries)})")
          if count != len(day_entries):
              print("ERROR: count mismatch", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Fail if no source succeeded
        if: |
          steps.release.outcome != 'success' &&
          steps.artifact.outcome != 'success' &&
          steps.reconstruct.outcome != 'success'
        run: |
          echo "ERROR: no source produced PNGs for ${{ inputs.date }}"
          exit 1

      - name: Quantize reconstructed PNGs (reconstruct path only)
        if: steps.reconstruct.outcome == 'success'
        run: |
          if ! command -v pngquant >/dev/null 2>&1; then
            echo "ERROR: pngquant required for reconstruct path but not installed"
            exit 1
          fi
          count=$(ls day/*.png 2>/dev/null | wc -l)
          echo "Quantizing $count reconstructed PNGs to 64-color palette"
          for f in day/*.png; do
            pngquant --quality=80-100 --speed=1 --force 64 "$f" --output "$f"
          done
          echo "Sample sizes after quantization:"
          ls -lh day/*.png | head -5

      - name: Reset day in timeline to extracted PNGs
        run: |
          python3 -u << 'PY'
          import json, re
          from pathlib import Path

          day = "${{ inputs.date }}"
          day_start = day + '_000000'
          day_end = day + '_999999'

          timeline = json.load(open('timeline.json'))
          kept = [e for e in timeline if not (day_start <= e['time'] <= day_end)]

          new_entries = []
          for png in sorted(Path('day').glob(f'wdpsnapshot_{day}_*.png')):
              m = re.search(r'(\d{8}_\d{6})', png.name)
              if not m:
                  continue
              t = m.group(1)
              new_entries.append({
                  "time": t,
                  "kind": "png",
                  "src": png.name,
                  "name": t,
                  "bytes": png.stat().st_size,
              })

          merged = kept + new_entries
          merged.sort(key=lambda e: e['time'])
          json.dump(merged, open('timeline.json', 'w'), indent=2)
          print(f"Timeline: {len(timeline)} -> {len(merged)} entries")
          print(f"Injected {len(new_entries)} PNG entries for {day}")
          PY

      - name: Run backfill conversion with new make-diffs
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u backfill-day.py \
            --date "${{ inputs.date }}" \
            --day-dir day \
            --main-timeline timeline.json \
            --canonical-palette palette.json \
            --publish-dir publish \
            --merged-timeline-out merged-timeline.json \
            --files-to-delete-out delete-list.txt \
            --prior-base-dir assets

      - name: Effective mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "dry_run=false" >> $GITHUB_OUTPUT
          else
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload new bases + diffs
        if: steps.mode.outputs.dry_run == 'false'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for f in publish/*.png publish/wdpdiff_*.json; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            rclone copyto "$f" ":s3:${R2_BUCKET}/${b}" \
              --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
              --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --s3-no-check-bucket --log-level ERROR
          done

      - name: Update main timeline
        if: steps.mode.outputs.dry_run == 'false'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copyto merged-timeline.json ":s3:${R2_BUCKET}/timeline.json" \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR

      - name: Delete stale old files
        if: steps.mode.outputs.dry_run == 'false'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 -u << 'PY'
          from pathlib import Path
          old = [line.strip() for line in open('old-day-files.txt') if line.strip()]
          new = set(p.name for p in Path('publish').iterdir()
                    if p.name.startswith('wdpsnapshot_') or p.name.startswith('wdpdiff_'))
          stale = [f for f in old if f not in new]
          with open('delete-old.txt', 'w') as f:
              f.write('\n'.join(stale))
          print(f"Stale old files to delete: {len(stale)}")
          PY
          if [ -s delete-old.txt ]; then
            rclone delete ":s3:${R2_BUCKET}" \
              --files-from delete-old.txt \
              --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
              --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --s3-no-check-bucket --log-level ERROR
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rediff-${{ inputs.date }}-${{ github.run_id }}
          path: |
            day/
            publish/
            merged-timeline.json
            download-list.txt
            old-day-files.txt
            delete-old.txt
          retention-days: 90
          if-no-files-found: warn
