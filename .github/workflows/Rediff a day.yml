name: Rediff a day

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYYMMDD or blank (auto-pick earliest day needing rediff)'
        required: false
        default: ''
      source:
        description: 'auto: artifact→snap→release→reconstruct. Or force one.'
        type: choice
        required: false
        default: auto
        options:
          - auto
          - artifact
          - snap
          - release
          - reconstruct
      dry_run:
        description: 'Dry run — no R2 writes'
        type: boolean
        default: false

concurrency:
  group: rediff-batch
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  rediff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            make-diffs.py
            backfill-day.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python3 -m pip install --quiet pillow numpy brotli

      - name: Install tools
        run: |
          timeout 300 curl -fsSL -o rclone.deb https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone.deb
          rm -f rclone.deb
          if ! command -v pngquant >/dev/null 2>&1; then
            timeout 300 sudo apt-get update -qq || true
            timeout 300 sudo apt-get install -y --no-install-recommends pngquant \
              || echo "WARN: pngquant unavailable; reconstruct path will fail if reached"
          fi

      - name: Download timeline and palette
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p assets day publish
          if rclone lsf ":s3:${R2_BUCKET}" \
               --include "timeline-rediff.json" \
               --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
               --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
               --s3-no-check-bucket --log-level ERROR | grep -q "timeline-rediff.json"; then
            TIMELINE_SRC=timeline-rediff.json
          else
            TIMELINE_SRC=timeline.json
          fi
          echo "Timeline source: $TIMELINE_SRC"
          echo "TIMELINE_SRC=$TIMELINE_SRC" >> $GITHUB_ENV
          rclone copyto ":s3:${R2_BUCKET}/${TIMELINE_SRC}" timeline.json \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR
          rclone copyto ":s3:${R2_BUCKET}/palette.json" palette.json \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR

      - name: Determine target day
        id: target
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            echo "Mode: manual (${{ inputs.date }})"
            echo "day=${{ inputs.date }}" >> $GITHUB_OUTPUT
          else
            set +e
            day=$(python3 -u << 'PY'
          import json, sys
          from collections import defaultdict
          THRESHOLD_MULT = 1.0
          timeline = json.load(open('timeline.json'))
          all_png_times = {e['time'] for e in timeline if e['kind'] == 'png'}
          by_day = defaultdict(list)
          for e in timeline:
              by_day[e['time'][:8]].append(e)
          for day in sorted(by_day.keys()):
              entries = by_day[day]
              for e in entries:
                  if e['kind'] == 'diff':
                      base = e.get('base')
                      if base and base not in all_png_times:
                          print(day); sys.exit(0)
                      if e.get('codec') != 'br':
                          print(day); sys.exit(0)
              base_sizes = {}
              for p in entries:
                  if p['kind'] == 'png':
                      base_sizes[p['time']] = p.get('bytes', 0)
              for p in timeline:
                  if p['kind'] == 'png' and p['time'] < day + '_000000':
                      base_sizes[p['time']] = p.get('bytes', 0)
              cumulative = defaultdict(int)
              for e in entries:
                  if e['kind'] != 'diff': continue
                  base = e.get('base')
                  if base not in base_sizes: continue
                  cumulative[base] += e.get('bytes', 0)
                  if base_sizes[base] and cumulative[base] > THRESHOLD_MULT * base_sizes[base]:
                      print(day); sys.exit(0)
          sys.exit(1)
          PY
            )
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && [ -n "$day" ]; then
              echo "Auto-picked: $day"
              echo "day=$day" >> $GITHUB_OUTPUT
            elif [ "$rc" -eq 1 ] || [ -z "$day" ]; then
              echo "No days need rediffing"
              echo "day=" >> $GITHUB_OUTPUT
            else
              echo "ERROR: auto-pick failed with rc=$rc"
              exit 1
            fi
          fi

      - name: Determine required files
        if: steps.target.outputs.day != ''
        run: |
          python3 -u << 'PY'
          import json, sys
          timeline = json.load(open('timeline.json'))
          day = "${{ steps.target.outputs.day }}"
          day_entries = [e for e in timeline if day + '_000000' <= e['time'] <= day + '_999999']
          if not day_entries:
              print(f"ERROR: no entries for {day}"); sys.exit(1)
          prior = [e for e in timeline if e['time'] < day + '_000000']
          start_base = next((e for e in reversed(prior) if e['kind'] == 'png'), None)
          if start_base is None:
              start_base = next((e for e in day_entries if e['kind'] == 'png'), None)
              if start_base is None:
                  print("ERROR: no base found"); sys.exit(1)
          start_idx = next(i for i, e in enumerate(timeline)
                           if e['time'] == start_base['time'] and e['kind'] == 'png')
          last_time = day_entries[-1]['time']
          end_idx = next(i for i, e in enumerate(timeline) if e['time'] == last_time)
          relevant = timeline[start_idx:end_idx+1]
          with open('download-list.txt', 'w') as f:
              f.write('\n'.join(e['src'] for e in relevant))
          with open('old-day-files.txt', 'w') as f:
              f.write('\n'.join(e['src'] for e in day_entries))
          print(f"Will download {len(relevant)} files")
          print(f"Day has {len(day_entries)} existing files")
          PY

      - name: Download prior base + last diff from R2
        if: steps.target.outputs.day != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copy ":s3:${R2_BUCKET}" assets/ \
            --files-from download-list.txt \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR
          echo "Downloaded $(ls assets/ | wc -l) files"

      - name: Try artifact archive (backfill)
        id: artifact
        if: |
          steps.target.outputs.day != '' &&
          (inputs.source == 'artifact' || inputs.source == 'auto')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DATE: ${{ steps.target.outputs.day }}
        run: |
          set -euo pipefail
          ARTIFACT_ID=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"backfill-${DATE}-\")) | select(.expired == false) | \"\(.created_at) \(.id)\"" \
            | sort -r | head -1 | awk '{print $2}')
          if [ -z "${ARTIFACT_ID:-}" ]; then
            echo "No backfill artifact for $DATE"; exit 1
          fi
          echo "Using backfill artifact ID: $ARTIFACT_ID"
          mkdir -p /tmp/artifact && cd /tmp/artifact
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o artifact.zip
          unzip -q artifact.zip
          FOUND=$(find . -name "wdpsnapshot_${DATE}_*.png" | head -1)
          if [ -z "$FOUND" ]; then echo "Artifact missing PNGs"; exit 1; fi
          rm -rf "$GITHUB_WORKSPACE/day" && mkdir -p "$GITHUB_WORKSPACE/day"
          find . -name "wdpsnapshot_${DATE}_*.png" -exec cp {} "$GITHUB_WORKSPACE/day/" \;
          COUNT=$(ls "$GITHUB_WORKSPACE/day"/*.png | wc -l)
          echo "Extracted $COUNT snapshots"
          if [ "$COUNT" -lt 2 ]; then echo "ERROR: only $COUNT"; exit 1; fi

      - name: Try snap artifacts
        id: snap
        if: |
          steps.target.outputs.day != '' &&
          steps.artifact.outcome != 'success' &&
          (inputs.source == 'snap' || inputs.source == 'auto')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DATE: ${{ steps.target.outputs.day }}
        run: |
          set -euo pipefail
          ARTIFACT_IDS=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"snap-${DATE}-\")) | select(.expired == false) | .id")
          N=$(echo "$ARTIFACT_IDS" | grep -c . || true)
          echo "Found $N snap artifacts for $DATE"
          if [ "$N" -lt 50 ]; then echo "Only $N — incomplete"; exit 1; fi
          rm -rf "$GITHUB_WORKSPACE/day" && mkdir -p "$GITHUB_WORKSPACE/day"
          COUNT=0
          for id in $ARTIFACT_IDS; do
            ZIP="/tmp/snap-${id}.zip"
            curl -sL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/${id}/zip" \
              -o "$ZIP"
            unzip -q -o "$ZIP" -d "$GITHUB_WORKSPACE/day/"
            rm -f "$ZIP"
            COUNT=$((COUNT + 1))
            if [ $((COUNT % 20)) -eq 0 ]; then echo "  Downloaded $COUNT of $N..."; fi
          done
          PNG_COUNT=$(ls "$GITHUB_WORKSPACE/day"/wdpsnapshot_${DATE}_*.png 2>/dev/null | wc -l)
          echo "Extracted $PNG_COUNT snapshots"
          if [ "$PNG_COUNT" -lt 50 ]; then echo "ERROR: only $PNG_COUNT"; exit 1; fi

      - name: Try release archive
        id: release
        if: |
          steps.target.outputs.day != '' &&
          steps.artifact.outcome != 'success' &&
          steps.snap.outcome != 'success' &&
          (inputs.source == 'release' || inputs.source == 'auto')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DATE: ${{ steps.target.outputs.day }}
        run: |
          set -euo pipefail
          MONTH="${DATE:0:6}"
          TAG="r2-backup-${MONTH}"
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "No release $TAG"; exit 1
          fi
          mkdir -p /tmp/archive && cd /tmp/archive
          trap 'cd -; rm -f /tmp/archive/backup-*.tar.part* /tmp/archive/backup-*.sha256' EXIT
          gh release download "$TAG" --repo "$REPO" \
            --pattern "*.tar.part*" --pattern "*.sha256"
          if grep -q '\.tar\.part' "backup-${MONTH}.sha256"; then
            sha256sum -c "backup-${MONTH}.sha256"
          else
            EXP=$(awk '{print $1}' "backup-${MONTH}.sha256")
            ACT=$(cat backup-${MONTH}.tar.part* | sha256sum | awk '{print $1}')
            [ "$EXP" = "$ACT" ] || { echo "SHA256 mismatch"; exit 1; }
          fi
          rm -rf "$GITHUB_WORKSPACE/day" && mkdir -p "$GITHUB_WORKSPACE/day"
          cat backup-${MONTH}.tar.part* | tar -xf - -C "$GITHUB_WORKSPACE/day" \
            --wildcards --no-anchored "wdpsnapshot_${DATE}_*.png"
          COUNT=$(ls "$GITHUB_WORKSPACE/day"/wdpsnapshot_${DATE}_*.png 2>/dev/null | wc -l)
          echo "Extracted $COUNT snapshots"
          if [ "$COUNT" -lt 2 ]; then echo "ERROR: only $COUNT"; exit 1; fi

      - name: Reconstruct PNGs from bases + diffs
        id: reconstruct
        if: |
          steps.target.outputs.day != '' &&
          steps.artifact.outcome != 'success' &&
          steps.snap.outcome != 'success' &&
          steps.release.outcome != 'success' &&
          (inputs.source == 'reconstruct' || inputs.source == 'auto')
        run: |
          python3 -u << 'PY'
          import brotli, json, sys
          from pathlib import Path
          import numpy as np
          from PIL import Image

          def read_diff(path):
              raw = path.read_bytes()
              try:
                  return json.loads(brotli.decompress(raw))
              except Exception:
                  return json.loads(raw)

          def hex_to_rgb(h):
              return int(h[1:3], 16), int(h[3:5], 16), int(h[5:7], 16)

          def apply_diff(arr, diff, palette):
              if 'rows' in diff:
                  for y, x_start, runs in diff['rows']:
                      x = x_start
                      for idx, length in runs:
                          r, g, b = hex_to_rgb(palette[idx])
                          arr[y, x:x+length, 0] = r
                          arr[y, x:x+length, 1] = g
                          arr[y, x:x+length, 2] = b
                          x += length
              elif 'changes' in diff:
                  for x, y, idx in diff['changes']:
                      r, g, b = hex_to_rgb(palette[idx])
                      arr[y, x, 0] = r; arr[y, x, 1] = g; arr[y, x, 2] = b

          timeline = json.load(open('timeline.json'))
          palette = json.load(open('palette.json'))
          day = "${{ steps.target.outputs.day }}"
          day_entries = [e for e in timeline if day + '_000000' <= e['time'] <= day + '_999999']
          prior = [e for e in timeline if e['time'] < day + '_000000']
          start_base = next((e for e in reversed(prior) if e['kind'] == 'png'), None)
          if start_base is None:
              start_base = next((e for e in day_entries if e['kind'] == 'png'), None)
          start_idx = next(i for i, e in enumerate(timeline)
                           if e['time'] == start_base['time'] and e['kind'] == 'png')
          end_idx = next(i for i, e in enumerate(timeline) if e['time'] == day_entries[-1]['time'])

          src_dir = Path('assets')
          out_dir = Path('day')
          out_dir.mkdir(exist_ok=True)
          base_cache = {}
          def get_base(name):
              if name not in base_cache:
                  base_cache[name] = np.array(Image.open(src_dir / name).convert('RGBA'))
              return base_cache[name].copy()

          for entry in timeline[start_idx:end_idx+1]:
              t = entry['time']
              if not t.startswith(day): continue
              if entry['kind'] == 'png':
                  arr = np.array(Image.open(src_dir / entry['src']).convert('RGBA'))
                  Image.fromarray(arr, 'RGBA').save(out_dir / f"wdpsnapshot_{t}.png")
                  print(f"  Saved PNG (base): {t}")
              elif entry['kind'] == 'diff':
                  diff = read_diff(src_dir / entry['src'])
                  base_entry = next((e for e in timeline if e['time'] == diff['base'] and e['kind'] == 'png'), None)
                  if base_entry is None:
                      print(f"ERROR: no base for diff {entry['src']}"); sys.exit(1)
                  arr = get_base(base_entry['src'])
                  apply_diff(arr, diff, palette)
                  Image.fromarray(arr, 'RGBA').save(out_dir / f"wdpsnapshot_{t}.png")
                  print(f"  Saved PNG (diff): {t}")

          count = len(list(out_dir.glob('*.png')))
          print(f"\nReconstructed {count} PNGs (expected {len(day_entries)})")
          if count != len(day_entries):
              print("ERROR: count mismatch"); sys.exit(1)
          PY

      - name: Fail if no source succeeded
        if: steps.target.outputs.day != ''
        run: |
          if [ "${{ steps.artifact.outcome }}" != "success" ] && \
             [ "${{ steps.snap.outcome }}" != "success" ] && \
             [ "${{ steps.release.outcome }}" != "success" ] && \
             [ "${{ steps.reconstruct.outcome }}" != "success" ]; then
            echo "ERROR: no source produced PNGs for ${{ steps.target.outputs.day }}"
            exit 1
          fi

      - name: Quantize reconstructed PNGs (reconstruct path only)
        if: steps.reconstruct.outcome == 'success'
        run: |
          if ! command -v pngquant >/dev/null 2>&1; then
            echo "ERROR: pngquant required but not installed"; exit 1
          fi
          count=$(ls day/*.png 2>/dev/null | wc -l)
          echo "Quantizing $count PNGs"
          for f in day/*.png; do
            pngquant --quality=80-100 --speed=1 --force 64 "$f" --output "$f"
          done

      - name: Reset day in timeline to extracted PNGs
        if: steps.target.outputs.day != ''
        run: |
          python3 -u << 'PY'
          import json, re
          from pathlib import Path
          day = "${{ steps.target.outputs.day }}"
          timeline = json.load(open('timeline.json'))
          kept = [e for e in timeline if not (day + '_000000' <= e['time'] <= day + '_999999')]
          new_entries = []
          for png in sorted(Path('day').glob(f'wdpsnapshot_{day}_*.png')):
              m = re.search(r'(\d{8}_\d{6})', png.name)
              if not m: continue
              t = m.group(1)
              new_entries.append({
                  "time": t, "kind": "png", "src": png.name,
                  "name": t, "bytes": png.stat().st_size,
              })
          merged = kept + new_entries
          merged.sort(key=lambda e: e['time'])
          json.dump(merged, open('timeline.json', 'w'), indent=2)
          print(f"Timeline: {len(timeline)} -> {len(merged)} entries")
          print(f"Injected {len(new_entries)} PNG entries for {day}")
          PY

      - name: Run backfill conversion
        if: steps.target.outputs.day != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 -u backfill-day.py \
            --date "${{ steps.target.outputs.day }}" \
            --day-dir day \
            --main-timeline timeline.json \
            --timeline-name "${TIMELINE_SRC}" \
            --canonical-palette palette.json \
            --publish-dir publish \
            --merged-timeline-out merged-timeline.json \
            --files-to-delete-out delete-list.txt \
            --prior-base-dir assets

      - name: Effective mode
        id: mode
        if: steps.target.outputs.day != ''
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "dry_run=false" >> $GITHUB_OUTPUT
          else
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload new bases + diffs
        if: steps.target.outputs.day != '' && steps.mode.outputs.dry_run == 'false'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for f in publish/*.png publish/wdpdiff_*.json; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            if [[ "$b" == *.json ]]; then
              rclone copyto "$f" ":s3:${R2_BUCKET}/${b}" \
                --header-upload "Content-Encoding: br" \
                --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
                --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
                --s3-no-check-bucket --log-level ERROR
            else
              rclone copyto "$f" ":s3:${R2_BUCKET}/${b}" \
                --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
                --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
                --s3-no-check-bucket --log-level ERROR
            fi
          done

      - name: Update timeline
        if: steps.target.outputs.day != '' && steps.mode.outputs.dry_run == 'false'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copyto merged-timeline.json ":s3:${R2_BUCKET}/${TIMELINE_SRC}" \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR
          echo "Uploaded merged timeline as ${TIMELINE_SRC}"

      - name: Delete stale old files
        if: steps.target.outputs.day != '' && steps.mode.outputs.dry_run == 'false'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python3 -u << 'PY'
          from pathlib import Path
          old = [line.strip() for line in open('old-day-files.txt') if line.strip()]
          new = set(p.name for p in Path('publish').iterdir()
                    if p.name.startswith('wdpsnapshot_') or p.name.startswith('wdpdiff_'))
          stale = [f for f in old if f not in new]
          with open('delete-old.txt', 'w') as f:
              f.write('\n'.join(stale))
          print(f"Stale old files to delete: {len(stale)}")
          PY
          if [ -s delete-old.txt ]; then
            rclone delete ":s3:${R2_BUCKET}" \
              --files-from delete-old.txt \
              --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
              --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
              --s3-no-check-bucket --log-level ERROR
          fi

      - name: Upload artifact
        if: always() && steps.target.outputs.day != ''
        uses: actions/upload-artifact@v4
        with:
          name: rediff-${{ steps.target.outputs.day }}-${{ github.run_id }}
          path: |
            day/
            publish/
            merged-timeline.json
            download-list.txt
            old-day-files.txt
            delete-old.txt
          retention-days: 90
          if-no-files-found: warn
