name: Purge Duplicate Artifacts

on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'Artifact name prefix to clean (e.g. "snap-")'
        required: true
        default: 'snap-'
      dry_run:
        description: 'Only list what would be deleted'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: purge-duplicates
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
      REPO: ${{ github.repository }}
      FILTER: ${{ inputs.filter }}
    steps:
      - name: Verify token identity and permissions
        run: |
          set -euo pipefail
          echo "── Token prefix ──"
          prefix="${GH_TOKEN:0:10}"
          echo "Prefix: $prefix..."
          case "$prefix" in
            github_pat_*) echo "✅ Fine-grained PAT detected" ;;
            ghp_*)       echo "⚠️  Classic PAT detected (ghp_)" ;;
            *)           echo "❓ Not a PAT — likely the built-in github.token" ;;
          esac

          echo "── Can this token read the artifacts API? ──"
          if gh api "repos/$REPO/actions/artifacts?per_page=1" >/dev/null 2>&1; then
            echo "✅ Token can read artifacts API"
          else
            echo "❌ Token cannot read artifacts API — permissions likely wrong"
            exit 1
          fi

          echo "── Token permissions (fine-grained only) ──"
          gh api /user/permissions 2>/dev/null | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin)
              perms=d.get('permissions',{})
              actions=perms.get('actions')
              if actions is None:
                  print('ℹ️  No fine-grained permissions block (classic PAT or github.token)')
              else:
                  print(f'actions: {actions}')
                  if actions == 'write':
                      print('✅ actions:write — deletion should work')
                  else:
                      print('❌ actions:write NOT granted')
          except Exception:
              print('ℹ️  Could not read fine-grained permissions')
          " || true

      - name: Enumerate and classify
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | {id, name, created_at, expired, size_in_bytes}' \
            > artifacts.json

          python3 -u << 'PY'
          import json, os
          from collections import defaultdict

          prefix = os.environ['FILTER']
          groups = defaultdict(list)
          for line in open('artifacts.json'):
              line = line.strip()
              if not line: continue
              a = json.loads(line)
              if a['name'].startswith(prefix):
                  groups[a['name']].append(a)

          to_delete = []
          for name in sorted(groups):
              arts = groups[name]
              # Prefer non-expired, then newest
              arts.sort(key=lambda x: (not x['expired'], x['created_at']), reverse=True)
              keep = arts[0]
              if len(arts) > 1:
                  print(f"{name}: keep id={keep['id']} "
                        f"({keep['created_at']}, expired={keep['expired']}, "
                        f"{keep['size_in_bytes']}B) — delete {len(arts)-1}")
                  for a in arts[1:]:
                      to_delete.append(a['id'])

          with open('delete.txt', 'w') as f:
              for i in to_delete:
                  f.write(f"{i}\n")
          print(f"\nTotal duplicates to delete: {len(to_delete)}")
          PY

      - name: Delete duplicates
        if: inputs.dry_run == false
        run: |
          set -uo pipefail
          total=0; ok=0; fail=0
          while read -r id; do
            [ -z "$id" ] && continue
            total=$((total+1))
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1; then
              ok=$((ok+1))
              echo "[$ok/$total] ✓ $id"
            else
              fail=$((fail+1))
              echo "[$ok/$total] ✗ $id (failed)"
            fi
          done < delete.txt
          echo "----"
          echo "Deleted $ok of $total (failed: $fail)"
          if [ "$total" -gt 0 ] && [ "$fail" -eq "$total" ]; then
            echo "::error::Every deletion failed — token almost certainly lacks actions:write"
            exit 1
          fi

      - name: Verify uniqueness
        if: inputs.dry_run == false
        run: |
          set -euo pipefail
          dupes=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"$FILTER\")) | .name" \
            | sort | uniq -d || true)
          if [ -n "$dupes" ]; then
            echo "::warning::Still duplicated after purge:"
            echo "$dupes" | while read -r n; do echo "  - $n"; done
          else
            echo "✓ Every matching name now has exactly one artifact"
          fi
