name: Update Map Snapshot

on:
  workflow_dispatch:
  # schedule: (add your cron when ready)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch (to get download-and-stitch.sh)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            download-and-stitch.sh
          sparse-checkout-cone-mode: false

      - name: Install ImageMagick, pngquant and rclone
        run: |
          # Disable flaky third-party repositories that can cause hash mismatches
          # (Google Chrome, Microsoft packages, etc.) They are not needed here.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          # If there are other .list files from third parties, remove them as well
          # sudo rm -f /etc/apt/sources.list.d/other-repo.list

          # Update apt with retries
          for i in 1 2 3; do
            echo "Attempt $i to update apt package lists..."
            if sudo apt-get update -o Acquire::Retries=3; then
              echo "apt-get update succeeded"
              break
            else
              echo "apt-get update failed (attempt $i)"
              if [ $i -eq 3 ]; then
                echo "All attempts failed, exiting."
                exit 1
              fi
              sleep $((i * 10))
            fi
          done

          # Install imagemagick and pngquant
          sudo apt-get install -y imagemagick pngquant

          # Install rclone from GitHub Releases (more reliable than downloads.rclone.org)
          RCLONE_VERSION="1.65.0"  # Pin to a known version; adjust if needed
          curl -L --retry 5 --retry-delay 5 \
            -o rclone.deb \
            "https://github.com/rclone/rclone/releases/download/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.deb"
          sudo dpkg -i rclone.deb
          rm rclone.deb

      - name: Download and stitch tiles
        run: bash download-and-stitch.sh

      - name: Compress to 64-color indexed PNG (preserves transparency)
        run: |
          echo "Original size:"
          ls -lh output.png
          pngquant --quality=80-100 --speed=1 --force --verbose 64 output.png --output output.png
          echo "Compressed size:"
          ls -lh output.png

      - name: Upload snapshot to R2 and fix/update snapshots.json
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d_%H%M%S')
          mv output.png "wdpsnapshot_${TIMESTAMP}.png"
          SNAPSHOT_FILE="wdpsnapshot_${TIMESTAMP}.png"
          echo "Uploading ${SNAPSHOT_FILE} to R2..."
          rclone copyto "${SNAPSHOT_FILE}" \
            ":s3:${R2_BUCKET}/${SNAPSHOT_FILE}" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket \
            --verbose

          # Fix and update snapshots.json
          echo "Updating snapshots.json (auto‑repairing if corrupt)..."
          rclone cat ":s3:${R2_BUCKET}/snapshots.json" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" 2>/dev/null > current.json || echo "[]" > current.json

          python3 << EOF
          import json
          with open('current.json') as f:
              try:
                  data = json.load(f)
              except:
                  data = []
          # Ensure data is a list
          if not isinstance(data, list):
              data = []
          # Convert every item to a plain filename string
          cleaned = []
          for item in data:
              if isinstance(item, str):
                  cleaned.append(item)
              elif isinstance(item, dict) and 'filename' in item:
                  cleaned.append(item['filename'])
              # else discard (e.g., numbers, null)
          data = cleaned
          # Append new snapshot if not already present
          new_file = "${SNAPSHOT_FILE}"
          if new_file not in data:
              data.append(new_file)
          with open('snapshots.json', 'w') as f:
              json.dump(data, f)
          EOF

          rclone copyto snapshots.json ":s3:${R2_BUCKET}/snapshots.json" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" \
            --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --verbose
          echo "Done. snapshots.json is now a clean list of filenames."
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
