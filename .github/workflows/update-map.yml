name: Update Map Snapshot

on:
  workflow_dispatch:
  # schedule: (add your cron when ready)

concurrency:
  group: update-map
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main branch (to get scripts)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            download-and-stitch.sh
            incremental-diff.py
          sparse-checkout-cone-mode: false

      - name: Install pngquant and rclone
        run: |
          # Disable flaky third-party repositories that can cause hash mismatches
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list

          # Add APT timeouts to prevent indefinite hangs on Azure mirrors
          sudo tee /etc/apt/apt.conf.d/99timeout-retries > /dev/null <<'EOF'
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          Acquire::Retries "5";
          EOF

          # Update apt with retries, wrapped in a hard 5-minute timeout
          for i in 1 2 3; do
            echo "Attempt $i to update apt package lists..."
            if sudo timeout 300 apt-get update; then
              echo "apt-get update succeeded"
              break
            else
              echo "apt-get update failed or timed out (attempt $i)"
              if [ $i -eq 3 ]; then
                echo "All update attempts failed, exiting."
                exit 1
              fi
              sleep $((i * 10))
            fi
          done

          # Install pngquant only (no imagemagick — the stitch script uses Python/PIL).
          # --no-install-recommends + single small package = ~500 KB download.
          # Multi-layered retry: Acquire::Retries at HTTP layer, timeout per attempt, outer loop.
          if ! sudo timeout 180 apt-get install -y --no-install-recommends \
                 -o Acquire::Retries=5 pngquant; then
            echo "First install attempt failed; cleaning and retrying..."
            sudo apt-get clean
            for i in 1 2 3; do
              echo "Retry $i..."
              if sudo timeout 180 apt-get install -y --no-install-recommends \
                   -o Acquire::Retries=5 pngquant; then
                echo "Install succeeded on retry $i"
                break
              fi
              sudo apt-get clean
              sleep $((i * 15))
              if [ $i -eq 3 ]; then
                echo "All install attempts failed"
                exit 1
              fi
            done
          fi

          # Install rclone
          RCLONE_VERSION="1.65.0"
          curl -L --retry 5 --retry-delay 5 \
            -o rclone.deb \
            "https://github.com/rclone/rclone/releases/download/v${RCLONE_VERSION}/rclone-v${RCLONE_VERSION}-linux-amd64.deb"
          sudo dpkg -i rclone.deb
          rm rclone.deb

      - name: Install Python deps (pillow, numpy, brotli)
        run: python3 -m pip install --quiet --disable-pip-version-check pillow numpy brotli

      - name: Download and stitch tiles
        timeout-minutes: 10
        run: bash download-and-stitch.sh

      - name: Compress to 64-color indexed PNG (preserves transparency)
        run: |
          echo "Original size:"
          ls -lh output.png
          # --quality=100 forces lossless quantization: fails (exit 99) if source has >64 colors.
          # This catches upstream corruption (anti-aliasing, rendering bugs) loudly rather than
          # silently degrading. Current data is losslessly quantizable (MSE=0.000 in logs).
          pngquant --quality=100 --speed=1 --force --verbose 64 output.png --output output.png
          echo "Compressed size:"
          ls -lh output.png

      - name: Generate diff and upload to R2
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d_%H%M%S')
          echo "SNAP_TIMESTAMP=${TIMESTAMP}" >> $GITHUB_ENV
          SNAPSHOT_FILE="wdpsnapshot_${TIMESTAMP}.png"
          mv output.png "${SNAPSHOT_FILE}"
          echo "Processing ${SNAPSHOT_FILE}..."
          python3 incremental-diff.py --snapshot "${SNAPSHOT_FILE}"
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Archive snapshot for rediff window
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ env.SNAP_TIMESTAMP }}
          path: wdpsnapshot_*.png
          retention-days: 90
          if-no-files-found: warn

      - name: Preserve snapshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-snapshot-${{ github.run_id }}
          path: |
            output.png
            wdpsnapshot_*.png
          retention-days: 7
          if-no-files-found: warn
