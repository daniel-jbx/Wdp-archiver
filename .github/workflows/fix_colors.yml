name: Fix Specific Artifact Colors

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: fix-colors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timestamp: [
          "20261105_180124", "20261105_182555", "20261105_183107",
          "20261105_184629", "20261105_190126", "20261105_191615",
          "20261105_193134", "20261105_194602", "20261105_200110",
          "20261105_201604", "20261105_203835", "20261105_204611",
          "20261105_220112", "20261105_221612", "20261105_223115",
          "20261105_224609", "20261105_230113", "20261105_231609",
          "20261105_233107", "20261105_234616"
        ]
      max-parallel: 5
      fail-fast: false
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb

      - name: Download palette
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir -p work out artifacts
          rclone copyto ":s3:${R2_BUCKET}/palette.json" work/palette.json \
            --s3-provider=Cloudflare --s3-endpoint="$R2_ENDPOINT" \
            --s3-access-key-id="$R2_ACCESS_KEY_ID" --s3-secret-access-key="$R2_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket --log-level ERROR

      - name: Download and fix artifact
        env:
          # github.token has actions:write from the permissions block above.
          # Switch to secrets.PAT_TOKEN only if your org restricts built-in tokens.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TS: ${{ matrix.timestamp }}
        run: |
          set -euo pipefail
          ART_NAME="snap-${TS}"

          # Snapshot every non-expired artifact ID with this name.
          # These are the ones we may want to delete after the new upload.
          OLD_IDS=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"$ART_NAME\") | select(.expired == false) | .id" \
            | tr '\n' ' ')
          echo "OLD_IDS=${OLD_IDS}" >> "$GITHUB_ENV"
          echo "Existing IDs for $ART_NAME: ${OLD_IDS:-<none>}"

          # Newest one to download (sort by created_at, fall back to id).
          ART_ID=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name==\"$ART_NAME\") | select(.expired == false) | \"\(.created_at) \(.id)\"" \
            | sort -r | head -1 | awk '{print $2}')

          if [ -z "$ART_ID" ]; then
            echo "::error::No artifact found for $ART_NAME"
            exit 1
          fi

          echo "Fixing $ART_NAME (ID: $ART_ID)"
          curl -sL -f -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/artifacts/${ART_ID}/zip" \
            -o "artifacts/${ART_NAME}.zip"
          unzip -q -o "artifacts/${ART_NAME}.zip" -d artifacts/

          python3 -u << 'PY'
          import json
          from pathlib import Path
          import numpy as np
          from PIL import Image

          palette = json.load(open('work/palette.json'))
          canonical_rgb = [tuple(int(h[i:i+2], 16) for i in (1, 3, 5)) for h in palette]
          target = (0x76, 0x63, 0x4b)

          dists = [np.linalg.norm(np.array(c) - np.array(target)) for c in canonical_rgb]
          best_color = canonical_rgb[int(np.argmin(dists))]

          flat_palette = []
          for r, g, b in canonical_rgb:
              flat_palette.extend([r, g, b])
          flat_palette.extend([0] * (256 * 3 - len(flat_palette)))

          pal_img = Image.new('P', (1, 1))
          # Pillow >= 11 removed the camelCase alias `putPalette`.
          # `putpalette` is the canonical (lowercase) name and has existed for ages.
          pal_img.putpalette(flat_palette)

          # Image.Dither.NONE == 0. Some Pillow builds have reshuffled /
          # deprecated the enum; `dither=0` is always accepted.
          try:
              dither_none = Image.Dither.NONE
          except AttributeError:
              dither_none = 0

          pngs = list(Path('artifacts').glob('*.png'))
          if not pngs:
              raise SystemExit("No PNGs found in artifact — aborting so we don't upload an empty replacement")

          # Always write every PNG to out/, not just the modified ones.
          # Otherwise an artifact that needed no fixing produces an empty
          # out/ — upload-artifact@v4 still creates an artifact, and the
          # subsequent delete step then destroys the good copy.
          for png in pngs:
              arr = np.array(Image.open(png).convert('RGB'))
              mask = (arr[:, :, 0] == target[0]) & (arr[:, :, 1] == target[1]) & (arr[:, :, 2] == target[2])
              if mask.any():
                  arr[mask] = best_color
                  status = "Fixed"
              else:
                  status = "Kept "
              indexed = Image.fromarray(arr, 'RGB').quantize(palette=pal_img, dither=dither_none)
              indexed.save(Path('out') / png.name)
              print(f"{status} {png.name}")
          PY

      - name: Upload fixed artifact
        uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.timestamp }}
          path: out/
          overwrite: true

      - name: Delete superseded artifacts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          fail=0
          for id in ${OLD_IDS:-}; do
            [ -z "$id" ] && continue
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1; then
              echo "✓ Deleted old artifact $id"
            else
              # If it's already gone (e.g. upload-artifact's overwrite:true
              # removed it within the same run), that's fine — goal achieved.
              if gh api "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1; then
                echo "::error::Failed to delete artifact $id — it still exists"
                fail=$((fail+1))
              else
                echo "✓ Old artifact $id already gone (overwritten)"
              fi
            fi
          done
          if [ "$fail" -gt 0 ]; then
            echo "::error::$fail deletion(s) failed — token likely lacks actions:write"
            exit 1
          fi

      - name: Verify exactly one artifact remains
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ART_NAME: snap-${{ matrix.timestamp }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$REPO/actions/artifacts?name=$ART_NAME" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          echo "Non-expired artifacts named $ART_NAME: $count"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly 1 artifact named $ART_NAME, found $count"
            exit 1
          fi
