name: Bootstrap timeline.json

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install rclone
        run: |
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.deb
          sudo dpkg -i rclone-current-linux-amd64.deb

      - name: Download snapshots.json from R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copyto ":s3:${R2_BUCKET}/snapshots.json" snapshots.json \
            --s3-provider="Cloudflare" \
            --s3-endpoint="${R2_ENDPOINT}" \
            --s3-access-key-id="${R2_ACCESS_KEY_ID}" \
            --s3-secret-access-key="${R2_SECRET_ACCESS_KEY}" \
            --s3-no-check-bucket
          echo "Downloaded snapshots.json:"
          ls -lh snapshots.json
          python3 -c "import json; print(f'  entries: {len(json.load(open(\"snapshots.json\")))}')"

      - name: Generate timeline.json
        run: |
          python3 bootstrap-timeline.py snapshots.json timeline.json
          echo
          echo "First 400 chars of output:"
          head -c 400 timeline.json
          echo

      - name: Upload timeline.json to R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          rclone copyto timeline.json ":s3:${R2_BUCKET}/timeline.json" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="${R2_ENDPOINT}" \
            --s3-access-key-id="${R2_ACCESS_KEY_ID}" \
            --s3-secret-access-key="${R2_SECRET_ACCESS_KEY}" \
            --s3-no-check-bucket
          echo "Uploaded."
          echo "Remote size:"
          rclone lsl ":s3:${R2_BUCKET}" \
            --include "timeline.json" \
            --s3-provider="Cloudflare" \
            --s3-endpoint="${R2_ENDPOINT}" \
            --s3-access-key-id="${R2_ACCESS_KEY_ID}" \
            --s3-secret-access-key="${R2_SECRET_ACCESS_KEY}" \
            --s3-no-check-bucket
